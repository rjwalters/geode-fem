name: ci-test-coverage

# Issue #785: several geode-core integration-test targets (wave ports,
# iterative sweep, matrix-free driven equivalence) ran in no CI job. Nothing
# runs a blanket `cargo test -p geode-core`, so each target is only enforced if
# a workflow step names it. This guard lists every `crates/*/tests/*.rs` and
# `examples/*/tests/*.rs` target and fails when one is run by no workflow and
# is not on the known-backlog allowlist
# (`scripts/ci-test-coverage-allowlist.txt`), or when an allowlist entry has
# gone stale. It is a static file scan with no cargo build, and takes about a
# second.
#
# Issue #921: it also tracks each crate's unit-test (`--lib`) target as
# `<crate>/lib`, which only an unfiltered `--lib` (or no-selector) run
# covers, so narrowing a blanket `--lib` step to module filters fails here;
# and it checks the lib targets' `#[ignore]`d tests like the integration
# targets' (scripts/ci-test-coverage-ignored-allowlist.txt).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Issue #1742: merge queue — run on each merge group's combined tree.
  # The default checkout (github.sha) is the group's commit, not the PR
  # head or main.
  merge_group:
    types: [checks_requested]

# Issue #899: a newer push to a PR cancels that PR's older run. On main a
# started run is never cancelled, and at most one run waits: a newer one
# replaces the waiting one.
#
# Issue #1742: merge-group runs are keyed by the group's unique head SHA, so
# a PR or push run can neither supersede nor cancel them (cancel-in-progress
# stays PR-only, per issue #899).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: every test target is run by some workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Self-test the workflow parser (synthetic workflows)
        run: python3 scripts/ci-test-coverage.py --self-test

      - name: Check test-target coverage (print the full table)
        run: python3 scripts/ci-test-coverage.py --table

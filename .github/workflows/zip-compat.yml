name: ZIP compatibility and security

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  # Issue #1742: merge queue — run on each merge group's combined tree.
  # The default checkout (github.sha) is the group's commit, not the PR
  # head or main.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Issue #1742: merge-group runs are keyed by the group's unique head SHA, so
# a PR or push run can neither supersede nor cancel them; runs are never
# cancelled in progress.
concurrency:
  group: zip-compat-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false

jobs:
  native-archive-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim runner disk for the multi-GB append tests
        shell: bash
        run: |
          # The append_near_4gb tests write multi-GB archives and previously
          # failed intermittently with StorageFull. Remove preinstalled
          # toolchains this job does not use; print df before and after so any
          # recurrence shows the free-space figure in the runner log.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Install checksum-pinned LibTorch 2.9 CPU archive
        shell: bash
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.9.0%2Bcpu.zip' \
            --output "$RUNNER_TEMP/libtorch.zip"
          echo "22de42abde933be46ce843467930bd0190b72271bfa2c11f84db95591a9834f1  $RUNNER_TEMP/libtorch.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/libtorch.zip" -d "$RUNNER_TEMP/libtorch-install"
      - name: Test shipped archive readers, unified features, and native extraction
        run: |
          df -h /
          python3 security/zip-compat/run.py \
            --work-dir "$RUNNER_TEMP/zip-compat" \
            --libtorch "$RUNNER_TEMP/libtorch-install/libtorch" \
            --extract-archive "$RUNNER_TEMP/libtorch.zip" \
            --extract-sha256 22de42abde933be46ce843467930bd0190b72271bfa2c11f84db95591a9834f1
      - name: Retain test results and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zip-compat-results
          path: |
            ${{ runner.temp }}/zip-compat/*.log
            ${{ runner.temp }}/zip-compat/result.json

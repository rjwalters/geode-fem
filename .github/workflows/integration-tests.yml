name: integration-tests

# Issue #786: the geode-core and geode-validation integration-test targets
# that no other workflow ran (the backlog in
# scripts/ci-test-coverage-allowlist.txt, found by the #785 coverage guard).
# There is no blanket `cargo test -p geode-core` job, so each target is
# named with `--test`, and the guard (workflow ci-test-coverage) sees exactly which
# ones run here. Default (non-#[ignore]d) tier only, release, CPU / ndarray
# backend (TestBackend = NdArray<f64>), no ARPACK: only
# `sparse_eigensolver` has an arpack-gated test, and arpack.yml runs it.
#
# Timings (default tier, release, ubuntu-latest 4 vCPU, measured in CI for
# #786): every geode-validation target finishes in under 1 s (about 6 s
# for all 26). In geode-core every target finishes in under 20 s except
# sphere_pec_eigenmode (about 73 s), with about 130 s for all 74. The cold
# release build of the test binaries dominates (about 24 min for geode-core
# and 8 min for geode-validation; a warm cache cuts it to a few minutes), so
# the two crates build in parallel jobs. Cold job wall times on the #786 PR:
# core-tests 27 min, validation-tests 8 min.
#
# What stays out, and why, is recorded per entry in the allowlist.
# Targets whose default tier is empty (every test #[ignore]d) are not run
# here for the default tier only, since that would just compile them
# (clippy --tests in arpack.yml already does that). Two of them run their
# --ignored tier in core-dense-eigen below (issue #796), and two more run in
# core-tests with --include-ignored (issue #813). The rest are too slow or
# are benchmarks.
#
# Issue #793: running a target's default tier does not run its #[ignore]d
# tests, so the guard also checks, per test, that each ignored test of a
# covered target runs in some workflow. The core-ignored job and the
# validation-tests --ignored step below run those tiers in release; what
# stays out is in scripts/ci-test-coverage-ignored-allowlist.txt.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: cargo test -p geode-core --release (integration targets, linux)
    runs-on: ubuntu-latest
    # About 24 min cold build + about 5 min of tests (27 min measured cold
    # before the --ignored step was added); 45 min is the per-job bound
    # (issue #772) and covers a cold cache.
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-tests-${{ hashFiles('**/Cargo.lock') }}

      # spade-mesh enables the `#![cfg(feature = "spade-mesh")]`
      # spade_port_mesh target (2-D Delaunay port meshing, issue #582).
      # These two targets' only test used to be #[ignore]d because faer
      # 0.24's dense gevd / qz_real panicked under debug-assertions (about
      # 31 s and 80 s on ubuntu-latest in release). Since issue #813 the test
      # is ignored in debug builds only (#[cfg_attr(debug_assertions,
      # ignore)], slow there), so in this release build it is in the default
      # tier; --include-ignored runs it either way. The other targets whose
      # tests are all #[ignore]d stay on the allowlist (each release
      # --ignored tier timed out at 80 min in CI, or is a 42-min wall-clock
      # benchmark).
      - name: geode-core release-only targets (debug-ignored tests)
        run: |
          cargo test -p geode-core --release --features spade-mesh \
              --test cube_convergence_regression \
              --test derham_gauge_invariance -- --include-ignored

      - name: geode-core integration targets (default tier)
        run: |
          cargo test -p geode-core --release --features spade-mesh \
              --test analytic_cladding_bc_fiber_benchmark \
              --test assembly \
              --test circular_waveguide_modes \
              --test cocg_burn_equivalence \
              --test derham_curl \
              --test derham_divergence \
              --test derham_exact_sequence \
              --test derham_gradient_kernel \
              --test derham_gradient \
              --test driven_manufactured \
              --test driven_p2_adjoint \
              --test driven_p2_convergence \
              --test driven_upml \
              --test eigensolver \
              --test electrostatic_capacitance \
              --test extraction \
              --test faer_qz_debug_overflow_guard \
              --test fe_assemble \
              --test fiber_dispersion_benchmark \
              --test formulation_audit_graddiv \
              --test high_contrast_fiber_benchmark \
              --test hybrid_port_lossy \
              --test hybrid_port_microstrip \
              --test hybrid_port_modes \
              --test hybrid_wave_port \
              --test leontovich_roughness \
              --test leontovich_surface_impedance \
              --test london_eigen_kinetic_inductance \
              --test london_surface_impedance \
              --test lp01_profile_selector_benchmark \
              --test lumped_port \
              --test magnetostatic_heterogeneous \
              --test magnetostatic_inductance \
              --test magnetostatic_wire \
              --test matched_upml_burn \
              --test material_upload_precision \
              --test mesh_roundtrip \
              --test mie_driven_scattering \
              --test mixed_pencil_fiber_benchmark \
              --test mixed_precision_refinement \
              --test motor_torque_benchmark \
              --test nedelec_cavity_p2_convergence \
              --test nedelec_cavity \
              --test nedelec_matrix_free_equivalence \
              --test nedelec_nu_wrapper \
              --test nedelec_sparse \
              --test nedelec \
              --test nedelec2_3d_element \
              --test nedelec2_convergence \
              --test p1_local_matrices \
              --test palace_ingestion \
              --test patch_antenna_benchmark \
              --test patch_capstone_diffopt \
              --test patch_conformal_diffopt \
              --test patch_diffopt \
              --test patch_mesh \
              --test pec_mask_face_exact \
              --test sigma_conductivity \
              --test slotless_pm_field \
              --test soi_waveguide_benchmark \
              --test spade_port_mesh \
              --test sphere_matched_upml_eigenmode \
              --test sphere_mesh \
              --test sphere_pec_cavity_sparse \
              --test sphere_pec_eigenmode \
              --test sphere_pml_anisotropic_eigenmode \
              --test sphere_pml_eigenmode \
              --test sphere_silvermuller_eigenmode \
              --test spiral_mesh \
              --test step_index_fiber_benchmark \
              --test torque_loop_oracle \
              --test transient_sparams \
              --test transmon_diffopt \
              --test transmon_eigen_sensitivity \
              --test transmon_eigenmode \
              --test transmon_mesh \
              --test transmon_quantum \
              --test vtu_roundtrip \
              --test waveguide_gauge_higher_order

  core-dense-eigen:
    # Issue #796: the dense complex eigensolver (`FaerComplexEigensolver`)
    # used faer 0.24's generalized complex QZ, which did not terminate on
    # pencils above ~500 DOF. That kept mie_sphere and derham_kernel_dim
    # (and the silvermuller_self_consistent* targets, still allowlisted as
    # too slow) out of CI: their --ignored tiers timed out at 80 min
    # (#786). The solver is now a dense shift-invert. Measured release
    # --ignored tiers, local, 6 threads on a loaded host: mie_sphere 23 s,
    # derham_kernel_dim 42 s. dense_complex_eigensolver_bounded is the
    # #796 regression guard (default tier, about 2 s, with a 120-s
    # watchdog per solve so a regression fails instead of hanging). This is
    # its own job, so a cold build here runs in parallel with core-tests
    # and does not push core-tests toward its 45-min bound.
    #
    # Issue #800: the dense real eigensolver (`FaerDenseEigensolver`) used
    # faer 0.24's generalized real QZ, which is many times slower from ~590
    # DOF (an AED window spin) and loses accuracy on the Mie sub-blocks. It
    # is now a dense shift-invert too. dense_real_eigensolver_bounded is the
    # #800 regression guard (default tier, about 1.5 s locally; it checks
    # the spectrum against a symmetric Cholesky reference and holds the
    # 600-DOF solve to a 4-s speed budget, with a 120-s watchdog).
    name: cargo test -p geode-core --release (dense eigensolver targets, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-dense-eigen-${{ hashFiles('**/Cargo.lock') }}

      - name: dense eigensolver regression guards (default tier)
        run: |
          cargo test -p geode-core --release \
              --test dense_complex_eigensolver_bounded \
              --test dense_real_eigensolver_bounded

      # Every test in mie_sphere and derham_kernel_dim is #[ignore]d (faer
      # 0.24's dense eigen paths panic under debug-assertions), so they run
      # in release with --ignored. The three sphere_* targets run their
      # default tier in core-tests; their #[ignore]d dense-complex tests run
      # here. Measured release --ignored times, local: sphere_pml_eigenmode
      # 18 s, sphere_pml_anisotropic_eigenmode 12 s,
      # sphere_silvermuller_eigenmode 25 s.
      - name: dense complex eigensolver targets (--ignored tier)
        run: |
          cargo test -p geode-core --release \
              --test mie_sphere \
              --test derham_kernel_dim \
              --test sphere_pml_eigenmode \
              --test sphere_pml_anisotropic_eigenmode \
              --test sphere_silvermuller_eigenmode -- --ignored

  core-ignored:
    # Issue #793: the #[ignore]d tests of targets whose default tier runs in
    # core-tests. Most are #[ignore]d as heavy benchmarks that are slow in
    # debug; in release each finishes in seconds to about 1.5 min. (Tests
    # ignored only under debug-assertions, via
    # `cfg_attr(debug_assertions, ignore)`, already run in core-tests'
    # release default tier.) A separate job, so its build and run time do
    # not push core-tests toward its 45-min bound. What stays out, and why,
    # is in scripts/ci-test-coverage-ignored-allowlist.txt.
    name: cargo test -p geode-core --release (--ignored tiers, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-ignored-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-tests-

      # Measured release times on ubuntu-latest, one test at a time:
      # fiber_dispersion_benchmark 90 s (it also rewrites
      # benchmarks/fiber_dispersion/results.toml in the checkout),
      # mixed_pencil_fiber_benchmark 20 s,
      # mixed_precision_refinement 18 s, motor_torque_benchmark 14 s,
      # mie_driven_scattering 12 s, transmon_diffopt 10 s (two tests),
      # sphere_matched_upml_eigenmode 8 s (two tests), the rest 0-5 s.
      - name: geode-core release-only and heavy tests (--ignored tier)
        run: |
          cargo test -p geode-core --release --features spade-mesh \
              --test analytic_cladding_bc_fiber_benchmark \
              --test fiber_dispersion_benchmark \
              --test high_contrast_fiber_benchmark \
              --test lp01_profile_selector_benchmark \
              --test magnetostatic_wire \
              --test mie_driven_scattering \
              --test mixed_pencil_fiber_benchmark \
              --test mixed_precision_refinement \
              --test motor_torque_benchmark \
              --test sphere_matched_upml_eigenmode \
              --test step_index_fiber_benchmark \
              --test transient_sparams \
              --test transmon_diffopt \
              --test transmon_mesh \
              --test transmon_quantum -- --ignored

      # The real 133k / 157k-DOF transmon eigensolves. Measured release
      # times, one test at a time: 23-61 s each (about 4.2 min for these
      # six). Two threads bound the peak memory of the concurrent sparse
      # LU factorizations. The skipped tests are allowlisted with reasons.
      # real_eigen_sensitivity_release (issue #814): five 133k-DOF direct
      # eigensolves (base + material and geometry FD), about 70 s locally.
      - name: geode-core transmon eigenmode benchmarks (--ignored tier)
        run: |
          cargo test -p geode-core --release --features spade-mesh \
              --test transmon_eigenmode -- --ignored --test-threads 2 --exact \
              --skip real_transmon_matrix_free_matches_direct \
              --skip real_transmon_matrix_free_indefinite_matches_direct \
              --skip real_transmon_ams_beats_jacobi \
              --skip real_transmon_minres_ams_converges_at_sigma_4p5
          cargo test -p geode-core --release --features spade-mesh \
              --test transmon_eigen_sensitivity -- --ignored --exact \
              real_eigen_sensitivity_release

  validation-tests:
    name: cargo test -p geode-validation --release (reference fixtures, linux)
    runs-on: ubuntu-latest
    # The reference tests compare against committed NumPy / Julia / JAX /
    # ONNX / TF-Java fixtures under fixtures/, so no external toolchain is
    # needed at test time. About 10 min cold build, about 35 s of tests:
    # since issue #813 the five sphere_pec_* eigensolve tests (about 5.5 s
    # each locally, the 3300-DOF dense solve) are no longer #[ignore]d in
    # release.
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-validation-tests-${{ hashFiles('**/Cargo.lock') }}

      - name: geode-validation reference targets (default tier)
        run: |
          cargo test -p geode-validation --release \
              --test cube_cavity_jax_reference \
              --test cube_cavity_julia_reference \
              --test cube_cavity_onnx_reference \
              --test derham_julia_reference \
              --test derham_numpy_reference \
              --test mie_efficiencies_numpy_reference \
              --test mie_roots_julia_reference \
              --test mie_roots_numpy_reference \
              --test nedelec_local_numpy_reference \
              --test p1_local_numpy_reference \
              --test smoke \
              --test sphere_mie_jax_reference \
              --test sphere_mie_julia_small_reference \
              --test sphere_mie_numpy_reference \
              --test sphere_mie_tfjava_reference \
              --test sphere_pec_jax_reference \
              --test sphere_pec_julia_reference \
              --test sphere_pec_numpy_reference \
              --test sphere_pec_onnx_reference \
              --test sphere_pec_tfjava_reference \
              --test sphere_pml_jax_reference \
              --test sphere_pml_julia_reference \
              --test sphere_pml_julia_small_reference \
              --test sphere_pml_numpy_reference \
              --test sphere_pml_schema_smoke \
              --test sphere_pml_tfjava_reference

      # Issue #793: the release-only complex eigensolve comparisons (each
      # #[ignore]d because the complex dense eigen path is too slow or
      # panics under debug-assertions). They compare against the same
      # committed fixtures, so no toolchain is needed. Measured release times
      # on ubuntu-latest, one test at a time: sphere_pml_numpy 13 s (two
      # tests), sphere_mie_numpy 12 s, sphere_pml_{jax,tfjava} under 1 s.
      # (The sphere_pec_* and cube_cavity_* comparisons are no longer
      # ignored in release since #813, so the default-tier step above runs
      # them.)
      - name: geode-validation release-only eigensolve comparisons (--ignored tier)
        run: |
          cargo test -p geode-validation --release \
              --test sphere_mie_numpy_reference \
              --test sphere_pml_jax_reference \
              --test sphere_pml_numpy_reference \
              --test sphere_pml_tfjava_reference -- --ignored

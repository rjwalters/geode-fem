# TEMPORARY MEASUREMENT WORKFLOW (issue #786) -- DO NOT MERGE.
# Round 2: times the #[ignore]d tier of the geode-core targets whose default
# tier is empty (release, CPU/ndarray backend). Removed before review.
name: TEMP-measure-786

on:
  push:
    branches: [feature/issue-786]

jobs:
  measure:
    name: ignored tier ${{ matrix.t }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        t: [cube_convergence_regression, derham_gauge_invariance, derham_kernel_dim,
            gpu_driven_scaling, mie_sphere, silvermuller_self_consistent_vector_tracking,
            silvermuller_self_consistent, sparse_complex_eigensolver]
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: short
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-measure786-geode-core-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y libarpack2-dev pkg-config
          cargo test --release -p geode-core --features arpack,spade-mesh --test ${{ matrix.t }} --no-run
      - name: Run ignored tier
        run: |
          set +e
          cd crates/geode-core
          /usr/bin/time -o /tmp/t.time -f "%e %M" timeout -k 10 4800 cargo test --release -p geode-core --features arpack,spade-mesh --test ${{ matrix.t }} -- --ignored > /tmp/t.log 2>&1
          rc=$?
          echo "RESULT|${{ matrix.t }}|rc=$rc|$(cat /tmp/t.time | tr '\n' ' ')|$(grep -E '^test result:' /tmp/t.log | tail -1)"
          grep -E '^test .* \.\.\. ' /tmp/t.log
          if [ $rc -ne 0 ]; then tail -80 /tmp/t.log; fi

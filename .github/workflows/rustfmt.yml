name: rustfmt

# Issue #185 — enforce `cargo fmt` so format drift can't accumulate.
#
# Before this gate existed, ~11 files drifted from rustfmt and every PR
# had to manually carve them out of its diff. The check is cheap (no
# build, no dependency resolution — rustfmt only parses), so it runs
# unconditionally on every push/PR rather than behind a path filter.
#
# All other workflows in this repo are specialized, path-filtered
# physics/cross-check jobs; this is the one repo-wide lint gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Issue #1742: merge queue — run on each merge group's combined tree.
  # The default checkout (github.sha) is the group's commit, not the PR
  # head or main.
  merge_group:
    types: [checks_requested]

# Issue #899: a newer push to a PR cancels that PR's older run. On main a
# started run is never cancelled, and at most one run waits: a newer one
# replaces the waiting one.
#
# Issue #1742: merge-group runs are keyed by the group's unique head SHA, so
# a PR or push run can neither supersede nor cancel them (cancel-in-progress
# stays PR-only, per issue #899).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: cargo fmt --all -- --check
    runs-on: ubuntu-latest
    # rustfmt only parses (no build, no dependency resolution), so this
    # is the cheapest gate in the repo. A tight 5-min cap bounds queue
    # starvation without ever clipping a legitimate run (issue #354).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

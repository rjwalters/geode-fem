name: jax-sphere-pec

# Gated CI job for the JAX sphere-PEC reference (issue #1602).
#
# Sibling of `jax-sphere-pml.yml` and `jax-sphere-mie.yml`: it runs the JAX
# sphere-PEC pipeline in CI and asserts that the freshly emitted fixture
# matches the committed snapshot at
# `reference/fixtures/sphere_pec/jax_baseline.json` within each field's
# declared `tolerance_abs`.
#
# Triggers:
#   1. Path-filtered `pull_request` / `push` to main: runs only when the
#      change actually touches the JAX sphere-PEC pipeline, the modules it
#      imports, the generator, the committed snapshot, the generation-time
#      cross-check inputs, or this workflow.
#   2. Manual `workflow_dispatch`: run on demand against any branch. The
#      sphere-PEC generator takes no physics knobs (only `--out` and
#      `--tol`), so there are no dispatch inputs — unlike the sphere-PML
#      gate's `sigma0`.
#
# Scope clarification:
# This gate runs the JAX sphere-PEC pipeline on the bundled sphere mesh
# (`reference/fixtures/sphere_pec/sphere.msh`) — the same mesh and physics
# constants as the committed `jax_baseline.json`. The drift gate is
# **strict**: every output field in the freshly emitted fixture must agree
# with the committed one within the field's declared `tolerance_abs`. All
# 11 sphere-PEC output fields are real `f64`, so there is no c128
# magnitude-residual case here (unlike sphere-PML).
#
# The generator also cross-checks JAX against the NumPy baseline at
# `reference/fixtures/sphere_pec/baseline.json` and `sys.exit(2)`s when the
# physical eigenvalues disagree by more than `--tol` (default 1e-6), so this
# job inherits a second, independent check for free.
#
# This gate is independent of and complementary to the Rust per-PR drift
# gate in `geode-validation/tests/sphere_pec_jax_reference.rs` (which
# exercises the on-disk fixture from the Rust side). Both must pass: the
# Rust gate guards Burn vs the JAX snapshot, this gate guards the JAX
# snapshot vs the JAX pipeline. Until this workflow existed, the committed
# sphere-PEC snapshot had only the first half of that pair — which is how a
# stub fixture survived from 2026-06-04 (PR #131) to 2026-11-13 (#1592).

on:
  push:
    branches: [main]
    paths:
      - 'reference/jax/sphere_pec.py'
      - 'reference/jax/gen_sphere_pec_fixture.py'
      - 'reference/jax/requirements.txt'
      # Kernel + algorithmic dependencies of the JAX sphere-PEC pipeline:
      - 'reference/numpy/sphere_pec.py'
      - 'reference/numpy/nedelec_local_matrices.py'
      - 'reference/numpy/p1_local_matrices.py'
      - 'reference/numpy/derham.py'
      - 'reference/numpy/requirements.txt'
      # Committed snapshot + generation-time cross-check inputs:
      - 'reference/fixtures/sphere_pec/jax_baseline.json'
      - 'reference/fixtures/sphere_pec/baseline.json'
      - 'reference/fixtures/sphere_pec/sphere.msh'
      - '.github/workflows/jax-sphere-pec.yml'
  pull_request:
    branches: [main]
    paths:
      - 'reference/jax/sphere_pec.py'
      - 'reference/jax/gen_sphere_pec_fixture.py'
      - 'reference/jax/requirements.txt'
      - 'reference/numpy/sphere_pec.py'
      - 'reference/numpy/nedelec_local_matrices.py'
      - 'reference/numpy/p1_local_matrices.py'
      - 'reference/numpy/derham.py'
      - 'reference/numpy/requirements.txt'
      - 'reference/fixtures/sphere_pec/jax_baseline.json'
      - 'reference/fixtures/sphere_pec/baseline.json'
      - 'reference/fixtures/sphere_pec/sphere.msh'
      - '.github/workflows/jax-sphere-pec.yml'
  workflow_dispatch:

# Issue #899: a newer push to a PR cancels that PR's older run. On main a
# started run is never cancelled, and at most one run waits: a newer one
# replaces the waiting one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-drift-check:
    name: JAX sphere-PEC pipeline + strict snapshot drift gate
    runs-on: ubuntu-latest
    # Bound queue-wait + execution so this cross-check can never orphan
    # for the 24h GitHub ceiling (issue #354). The pipeline + drift gate
    # runs in a few minutes; 30 leaves headroom for a cold Python env.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            reference/jax/requirements.txt
            reference/numpy/requirements.txt

      - name: Install JAX (CPU) + NumPy + SciPy + meshio
        # CPU-only JAX install per reference/jax/requirements.txt.
        # JAX is ~1.5 GB unpacked; pip cache (above) keeps cold-start
        # CI runs reasonable. Versions are loosely pinned in the
        # requirements file so we don't trip on resolver issues across
        # minor Python patch releases.
        #
        # We also install reference/numpy/requirements.txt because the
        # JAX sphere-PEC pipeline depends on
        # `reference/numpy/sphere_pec.read_sphere_fixture` for mesh I/O
        # (`reference/jax/sphere_pec.py` imports it), which imports
        # `meshio` — declared only in the NumPy requirements file. Same
        # pattern as `jax-sphere-pml.yml`.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r reference/jax/requirements.txt
          python3 -m pip install -r reference/numpy/requirements.txt

      - name: Show toolchain versions (debug)
        run: |
          python3 --version
          python3 -c "import jax, numpy, scipy; print('jax', jax.__version__); print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
          python3 -c "import meshio; print('meshio', meshio.__version__)"

      # -----------------------------------------------------------------------
      # JAX sphere-PEC pipeline (issue #1602).
      # -----------------------------------------------------------------------
      #
      # Why this is the gate of record:
      #
      #   * The Rust gate at
      #     `geode-validation/tests/sphere_pec_jax_reference.rs` exercises
      #     the on-disk fixture but cannot detect drift between
      #     `reference/jax/sphere_pec.py` and the committed
      #     `jax_baseline.json` — only this workflow can.
      #   * `reference/jax/sphere_mie.py` already imports
      #     `reference/jax/sphere_pec.py`, so the sphere-PEC kernel runs
      #     under JAX in CI today; without this gate a change to it can
      #     silently invalidate the sphere-PEC snapshot while the
      #     sphere-Mie gate stays green.
      #
      # The drift comparator below is **strict**: if the freshly emitted
      # JAX fixture disagrees with the committed `jax_baseline.json`
      # beyond per-field `tolerance_abs`, this step fails.

      - name: Run JAX sphere-PEC pipeline (regenerate fixture for drift comparator)
        # Regenerate `jax_baseline.json` from the JAX pipeline into
        # target/out. The committed file in reference/fixtures/sphere_pec/
        # is the snapshot; this step is the snapshot's gate.
        run: |
          mkdir -p reference/jax/target/out
          python3 reference/jax/gen_sphere_pec_fixture.py \
              --out reference/jax/target/out/jax_baseline.json

      - name: Snapshot drift gate — fresh JAX sphere-PEC fixture vs committed
        # Strict numeric diff: every output field in the freshly emitted
        # `target/out/jax_baseline.json` must agree with the committed
        # `reference/fixtures/sphere_pec/jax_baseline.json` within the
        # field's declared `tolerance_abs`. All sphere-PEC output fields
        # are real `f64`, so this is a plain max |Δ| compare. Failure here
        # means either:
        #
        #   (a) the committed snapshot is stale — regenerate locally with
        #       `python3 reference/jax/gen_sphere_pec_fixture.py` and
        #       commit, OR
        #   (b) the JAX pipeline genuinely changed output (review the
        #       diff and decide whether to widen tolerance or fix the
        #       regression).
        #
        # The inline comparator below mirrors the one in
        # `jax-sphere-pml.yml`'s "Snapshot drift gate" step (minus the
        # c128 branch, which sphere-PEC has no field for) so the behavior
        # (and the failure message) is consistent across the JAX gates.
        run: |
          python3 <<'PY'
          import json, sys
          from pathlib import Path

          fresh_path     = Path("reference/jax/target/out/jax_baseline.json")
          committed_path = Path("reference/fixtures/sphere_pec/jax_baseline.json")

          def load(p):
              with open(p) as f:
                  return json.load(f)

          fresh     = load(fresh_path)
          committed = load(committed_path)

          # Compare every output field. Skip fields that have no
          # `tolerance_abs` (descriptive-only fields) — none in the
          # current schema, but be robust.
          fresh_out     = fresh["outputs"]
          committed_out = committed["outputs"]

          missing_in_fresh     = set(committed_out) - set(fresh_out)
          missing_in_committed = set(fresh_out)     - set(committed_out)
          if missing_in_fresh or missing_in_committed:
              print(f"FAIL: output-field set mismatch", file=sys.stderr)
              print(f"  missing in fresh     : {sorted(missing_in_fresh)}", file=sys.stderr)
              print(f"  missing in committed : {sorted(missing_in_committed)}", file=sys.stderr)
              sys.exit(1)

          n_fail = 0
          n_ok   = 0
          for name in sorted(fresh_out):
              f = fresh_out[name]
              c = committed_out[name]
              tol = float(c.get("tolerance_abs", 0.0))
              dtype = c.get("dtype", "f64")
              fd = list(f["data"])
              cd = list(c["data"])
              if len(fd) != len(cd):
                  print(f"FAIL [{name}]: length mismatch fresh={len(fd)} committed={len(cd)}",
                        file=sys.stderr)
                  n_fail += 1
                  continue
              # f64 (and any other real-valued dtype): max |Δ|.
              max_abs = max((abs(a - b) for a, b in zip(fd, cd)), default=0.0)
              status = "OK" if max_abs <= tol else "FAIL"
              print(f"  [{status}] {name:42s} ({dtype:>4}) "
                    f"max |Δ| = {max_abs:.6e}  tol = {tol:.6e}")
              if max_abs > tol:
                  n_fail += 1
              else:
                  n_ok += 1

          print()
          print(f"summary: {n_ok} fields OK, {n_fail} fields FAIL")
          if n_fail > 0:
              print()
              print("snapshot is stale — regenerate locally with:", file=sys.stderr)
              print("  python3 reference/jax/gen_sphere_pec_fixture.py "
                    "--out reference/fixtures/sphere_pec/jax_baseline.json",
                    file=sys.stderr)
              print("then commit the regenerated fixture.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload JAX sidecar artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jax-sphere-pec-artifacts
          path: |
            reference/jax/target/out/jax_baseline.json
          if-no-files-found: warn
          retention-days: 30

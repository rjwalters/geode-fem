# Design A adjoint min-max run (issue #1579, Epic #1252 Phase 4c).
# Written by `cargo run --release -j2 -p geode-core --example tcda_design_run`.
# Re-run and the regression pin: see README.md.

[meta]
description = "Epic #1252 Phase 4c child 2 (#1579): MMA epigraph min-max run of the Design A element on the recorded Phase-4 grid, from the #1536 baseline at equal footprint, with the #1578 lumped-feed adjoint and the #1535 manufacturability constraints."
backend = "ndarray"
float_dtype = "F64"
generated_at_commit = "dece2aba"
driver = "crates/geode-core/tests/common/tcda_design.rs (#1578)"
baseline = "benchmarks/tcda_baseline (#1536)"

[design]
n_edge = 50
n_params = 200
parameterization = "outline-only: 4*n_edge spline coefficients (right, left, top, bottom), millimetres"
superstrate = "fixed at the baseline eps_r = 2.0 (layers = []), so theta0 IS the recorded baseline"
bound_mm = 1
z_ref = 0.15
mm_per_unit = 14.9896229
mesh = "10080 tets, 2160 nodes (the #1536 baseline mesh, scaled)"

[grid]
omega_over_pi = [0.9, 1.0, 1.1]
theta_deg = [0, 30, 60]
phi_deg = [0, 90]
n_points = 18
source = "ScanGrid::reduced_comparison(PI), the 18-point comparison grid of #1580"

[cost]
# Measured on this host before the budget was fixed (the run always probes
# first; see the example's module docs).
build_s = 0.1
forward_pass_s = 199.45          # one assembly + 18 factorizations
adjoint_pass_s = 10.32          # one point: assembly + factorization + transpose back-solve
projected_s_per_iteration = 385.3
wall_clock_s = 1264.0
iterations = 4
evaluations = 5
failed_evaluations = 0
adjoint_passes = 44       # ConstrainedEpigraph::n_gradients()
active_margin = 0.15

[run]
stop_reason = "wall_clock_budget (1200 s); optimizer status Running"
best_iteration = 4   # the recorded design is the best feasible iterate, not the last
max_iter_budget = 8
wall_clock_budget_s = 1200
initial_worst_db = -3.50
final_worst_db = -6.23
final_worst_point = { omega_over_pi = 1.10, theta_deg = 60, phi_deg = 0 }
worst_e_plane_db = -6.23
worst_h_plane_db = -6.24
passive = true                  # all |Gamma| <= 1 + 1e-6
min_tet_volume_ratio = 0.241881   # > 0: no tet inverted at the final design
manufacturable = true    # ElementConstraints::is_violated() == false (sampled, #1535)
max_constraint_violation_mm = -6.708e-1

# Per-point |Gamma| (dB) at the final design, rows omega ascending;
# columns theta ascending. Same layout as benchmarks/tcda_baseline.

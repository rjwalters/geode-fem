# Design A adjoint min-max run (issue #1579, Epic #1252 Phase 4c).
# Written by `cargo run --release -j2 -p geode-core --example tcda_design_run`.
# Re-run and the regression pin: see README.md.

[meta]
description = "Epic #1252 Phase 4c child 2 (#1579): MMA epigraph min-max run of the Design A element on the recorded Phase-4 grid, from the #1536 baseline at equal footprint, with the #1578 lumped-feed adjoint and the #1535 manufacturability constraints."
backend = "ndarray"
float_dtype = "F64"
generated_at_commit = "12683e8a"
driver = "crates/geode-core/tests/common/tcda_design.rs (#1578)"
baseline = "benchmarks/tcda_baseline (#1536)"

[design]
n_edge = 13
n_params = 52
parameterization = "outline-only: 4*n_edge spline coefficients (right, left, top, bottom), millimetres"
superstrate = "fixed at the baseline eps_r = 2.0 (layers = []), so theta0 IS the recorded baseline"
bound_mm = 1
z_ref = 0.15
mm_per_unit = 14.9896229
mesh = "10080 tets, 2160 nodes (the #1536 baseline mesh, scaled)"

[grid]
omega_over_pi = [0.9, 0.95, 1.0, 1.05, 1.1]
theta_deg = [0, 15, 30, 45, 60]
phi_deg = [0, 90]
n_points = 50
source = "ScanGrid::phase4(PI, 0.2, 5), the recorded grid of #1536"

[cost]
# Measured on this host before the budget was fixed (the run always probes
# first; see the example's module docs).
build_s = 0.1
forward_pass_s = 227.00          # one assembly + 50 factorizations
adjoint_pass_s = 5.05          # one point: assembly + factorization + transpose back-solve
projected_s_per_iteration = 479.6
wall_clock_s = 5639.1
iterations = 16
evaluations = 42
failed_evaluations = 25
adjoint_passes = 372       # ConstrainedEpigraph::n_gradients()
active_margin = 0.15

[run]
stop_reason = "wall_clock_budget (5400 s); optimizer status Running"
best_iteration = 13   # the recorded design is the best feasible iterate, not the last
max_iter_budget = 30
wall_clock_budget_s = 5400
initial_worst_db = -3.50
final_worst_db = -6.27
final_worst_point = { omega_over_pi = 0.90, theta_deg = 60, phi_deg = 90 }
worst_e_plane_db = -6.31
worst_h_plane_db = -6.27
passive = true                  # all |Gamma| <= 1 + 1e-6
min_tet_volume_ratio = 0.000028   # > 0: no tet inverted at the final design
manufacturable = true    # ElementConstraints::is_violated() == false (sampled, #1535)
max_constraint_violation_mm = -1.344e-1

# Per-point |Gamma| (dB) at the final design, rows omega/pi = 0.9 .. 1.1;
# columns theta = 0,15,30,45,60. Same layout as benchmarks/tcda_baseline.
table_e_plane_db = [

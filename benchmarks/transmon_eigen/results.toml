# Transmon + readout-resonator eigenmode benchmark (Epic #476 Phase B,
# issue #492). Junction modeled as a lumped reactive shunt (L ∥ C) on the
# `lumped_element` surface; real symmetric pencil solved with the
# shift-invert Lanczos. Cross-validated against Palace on the same INPUT
# mesh at matched (first) order. Palace refines the PEC sheets internally,
# so it solves 183,891 ND unknowns against geode's 156,863 (see
# [oracles.palace_target2]); the frequency agreement below is unaffected,
# but any timing comparison built on this pair needs that caveat.
#
# Consumed by `crates/geode-core/tests/transmon_eigenmode.rs`
# (`real_transmon_eigenmodes_release`, `#[ignore]` release tier). The
# geode-fem numbers below are regenerated by that test; the
# [oracles.palace] block is populated from a real Palace run committed
# under reference/fixtures/transmon_palace/results_p1/.
#
# ---------------------------------------------------------------------------
# MIGRATION NOTE (issue #1045, 2026-10-11): MODE CLASSIFICATION RE-BASELINED.
# Palace re-run below the qubit (#1043, [oracles.palace_target2]) returns the
# 3.4528 GHz mode at 3.452749 GHz with port EPR 0.99424: it is the transmon
# qubit mode, not a spurious mode. The 17.49 GHz mode Palace shares is the
# port-sheet artifact of the distributed port term; the opt-in A2 shunt
# removes it (#1044, [port_voltage_a2]). Old keys -> new keys:
#   [spurious_mode] f_ghz, participation       -> [modes.qubit] (kind = "qubit";
#                                                  f_ghz now the committed
#                                                  six-decimal 3.452751, the
#                                                  four-decimal 3.4528 is
#                                                  [tripwires.qubit_l_doubling].base_f_ghz)
#   [spurious_mode] excluded = true            -> removed: the qubit is in the
#                                                  physical set and the <=1% gate
#   [spurious_mode] (gauge-saga history keys)  -> [gauge_history] (same values)
#   [spurious_mode] spurious_l_scaling_*       -> [tripwires.qubit_l_doubling]
#                                                  base_f_ghz / doubled_f_ghz /
#                                                  ratio / verdict
#   [spurious_mode] spurious_localization_participation
#                                              -> [tripwires.qubit_l_doubling].port_participation
#   [spurious_mode] projection_survives_divergence_free
#                                              -> [gauge_history].projection_qubit_survives_divergence_free
#   [spurious_mode] projection_junction_*      -> [gauge_history].projection_port_sheet_*
#   [spurious_mode] port_aware_junction_*      -> [gauge_history].port_aware_port_sheet_*
#   [modes.junction_lc]                        -> [modes.port_sheet_artifact]
#                                                  (kind = "port_sheet_artifact")
#   [tripwires.junction_l_doubling]            -> [tripwires.port_sheet_artifact_l_doubling]
#   [oracles.palace_target2] junction_lc_*     -> port_sheet_artifact_*
#   [oracles.palace_target2] l2_junction_lc_*  -> l2_port_sheet_artifact_*
#   every [modes.*] entry                      -> gains kind = "qubit" | "cavity" |
#                                                  "port_sheet_artifact"
# No measured number changed. [comparison] now gates the six physical modes
# (the qubit and five cavity modes); its worst case stays 0.032 %. The CPU

note = "Palace eigenmode run on the same INPUT mesh (MSH 2.2 conversion, node-preserving; Palace then refines around the PEC sheets and solves 183,891 ND unknowns against geode's 156,863), junction as reactive LumpedPort (L ∥ C, no R), PEC metal+exterior, readout ports open, Order 1 (matched to geode-fem first-order Nédélec), Target = 4.5 GHz. Every mode it returns agrees with geode-fem to ≤0.032% — the ≤1% bar is met with 25× margin, and the cross-solver mode identification rests on frequency agreement, NOT on participation agreement (see the port-EPR note above). It returns five cavity modes and the 17.49 GHz port-sheet artifact; the qubit mode lies below its Target and is in [oracles.palace_target2]. A p=2 config (palace_config_p2.json) is committed for the non-gating Phase-D convergence preview."

[oracles.palace_target2]
# Issue #1043 (phase P1 of the #1003 spike): the decisive external check of
# whether the 3.4528 GHz mode (then [spurious_mode], now [modes.qubit]) is the
# transmon qubit mode.
# Palace's eigensolve only searches at or above Target, so the committed
# [oracles.palace] run (Target 4.5 GHz) could not return it. This re-run
# changes only Target (4.5 -> 2.0 GHz) and N (6 -> 8), plus L -> 2L for the
# L-doubling cell. Mesh, materials, PEC, LumpedPort C and direction, Order,
# eigen tolerances and the linear solver are the committed values.
#
# VERDICT: CONFIRMED. Palace returns the mode at 3.452749 GHz with port-EPR
# p[1] = +0.99424 (|p[1]| ~ 1, as the spike predicted), and it follows the
# 1/sqrt(L) law (ratio 0.70810). geode and Palace agree to 5e-5 % on it.
# Phase P3 (#1045) re-baselined the classification on this evidence: the
# mode is [modes.qubit], and [spurious_mode] / excluded = true are gone (see
# the migration note at the top of this file).
#
# SAME-MESH, NOT CONVERGED. Both solvers run on the same input mesh at Order 1
# (Palace cracks and bisects around the PEC sheets internally and solves
# 183,891 ND unknowns against geode's 156,863). The agreement is a same-mesh
# cross-check. It is not the converged physical qubit frequency: #1036 / the
# #1050 review measured this mesh's scalar-eps C_Sigma dropping 26.3 % under
# one uniform refinement, with the converged value unmeasured
# (benchmarks/transmon_diffopt/multiparam_results.toml, [mesh_refinement]).
# The qubit frequency goes as 1/sqrt(C_Sigma + C_J), so it is not converged
# on this mesh either.
status = "measured"
measured_date = "2026-10-11"  # UTC; 2026-10-10 local
issue = 1043
palace_version = "fba6a5b"  # fba6a5b9d17ef09db2907e9c4c6f92d123d131c0, same as [oracles.palace]
palace_order = 1
run_processes = 8
eigensolver = "SLEPc, shift-invert, linear branch (no R)"
linear_solver = "Default -> SuperLU (GMRES Tol 1e-9)"

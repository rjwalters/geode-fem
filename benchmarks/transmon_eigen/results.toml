[gauge_history]
# Was the gauge-saga part of [spurious_mode] (#502, #509, #514). The values
# are unchanged; the prose is re-read in the light of #1043 / #1044: the mode
# these attempts could not remove (3.4528 GHz) is the qubit mode, which no
# correct gauge should remove, and the mode the bulk projection deflated
# (17.49 GHz) is the port-sheet artifact.
#
# Tree-cotree gauge attempt (issue #502, measured 2026-07-14): a
# spanning-tree DOF-elimination gauge (crate::eigen::gauge::TreeCotreeGauge)
# was implemented and shown to remove exactly rank(d⁰_interior) = 13747
# gradient DOFs from the 133108-DOF interior pencil (count == de-Rham
# gradient dimension, proven on cube fixtures). HOWEVER, DOF elimination
# (dropping tree rows/cols of BOTH K and M) is a *source*-problem gauge and
# is NOT spectrum-preserving for the generalized eigenproblem K x = λ M x:
# the physical eigenvectors have nonzero tree-edge components, so the
# constraint x_tree = 0 SHIFTS the computed spectrum. Measured: the
# resonator drifts to 5.2372 GHz (1.64%, OUTSIDE the ≤1% bar; a converged
# eigenvalue, stable across k=4/12/24 Krylov vectors), and a dense low
# cluster persists. The 3.4528 GHz qubit mode is not removed by tree-cotree
# DOF elimination either (nor should it be). The spectrum-preserving fix
# is a divergence-free projection (Zᵀ K Z, Zᵀ M Z), for which the shipped
# spanning tree supplies the cotree basis — the #502 follow-on landed as
# issue #509 (this projection); its own port-aware follow-on is issue #514.
gauged = false  # tree-cotree DOF elimination does not remove the 3.4528 GHz qubit mode (see note)
tree_cotree_gradient_dofs = 13747  # == rank(d⁰_interior) on this mesh
tree_cotree_resonator_drift_pct = 1.64  # gauged 5.2372 vs ungauged 5.1528 GHz
# Divergence-free projection attempt (issue #509, measured 2026-07-14): the
# spectrum-preserving M-orthogonal projector P = I − G(GᵀMG)⁻¹GᵀM with
# G = d⁰_interior (the sparse interior-restricted discrete gradient) was
# implemented (crate::eigen::projection) and factored once (GᵀMG is a
# 13747²-node SPD sparse LU, an order below the 133108-DOF edge pencil).
# UNLIKE tree-cotree DOF elimination, the projection PRESERVES the cavity
# spectrum: the 5.1513 GHz Palace resonator reproduces at 5.1528 GHz
# (0.029%, vs the DOF-elimination gauge's 1.64% shift) and every returned
# Ritz vector is divergence-free to machine level (‖GᵀMx‖/‖x‖_M ≈ 1e-15).
# The dense image(d⁰) near-zero cluster (13747 modes at λ≈0) collapses to at
# most ONE near-zero survivor. The bulk-d⁰ projection has TWO further
# effects, both root-caused and pinned in
# tests/transmon_eigenmode.rs::real_transmon_projection_deflates_junction_mode:
#   1. The 3.4528 GHz qubit mode SURVIVES — its eigenvector is genuinely
#      divergence-free (div-ratio ≈ 6e-15), so it is not a bulk-gradient
#      artifact and is M-orthogonal to image(d⁰_interior) → untouched by P.
#      (Before #1045 this was read as a surviving port-localized spurious
#      mode; #1043 showed it is the qubit mode, so surviving is correct.)
#   2. The 17.49 GHz port-sheet mode (p = 1) is DEFLATED AWAY. Its eigenvector
#      is a (near-)gradient field living largely in image(d⁰_interior), so the
#      bulk projection removes it with the gradient cluster. Targeting σ AT
#      17.49 GHz: ungauged resolves 17.4901 GHz (p = 1.0000), projected does
#      not return it (nearest 18.6927 GHz, 6.88%). Before #1045 this was
#      recorded as a loss of the "physical junction LC mode"; under the #1043 /
#      #1044 reading it is the port-sheet artifact, which A2 removes by
#      construction ([port_voltage_a2]).
# The #514 follow-on (port-aware projection) re-admitted that 17.49 GHz
# direction to match the committed oracle, which lists it. The committed
# benchmark path (ungauged + frequency classification) is unchanged.
#
# DEFLATION MECHANISM (measured directly on the raw UNGAUGED 17.49 GHz
# eigenvector, 2026-07-14): the ModeReport path drops EigenPair.vector, so the
# ungauged eigenvector is obtained via
# crate::eigen::projection::ungauged_mode_divergences and measured against the
# SAME M-orthogonal projector P = I − G(GᵀMG)⁻¹GᵀM. It is a NEAR-GRADIENT
# field — its divergence ratio ‖GᵀMx‖/‖x‖_M = 5.0173e1 (macroscopic, O(10)),
# in stark contrast to the qubit mode's solenoidal 6.18e-15 — and P
# deflates it: the projected M-norm ‖Px‖_M/‖x‖_M = 1.0638e-4 ≈ 0 (the mode
# lives almost entirely in image(d⁰_interior)). Pinned in
# real_transmon_projection_deflates_junction_mode.
projection_gauged = false  # bulk-d⁰ div-free projection does not remove the qubit mode (see note)
projection_qubit_survives_divergence_free = true  # was projection_survives_divergence_free; the qubit mode is solenoidal (div-ratio ≈ 6e-15)
projection_cavity_resonator_pct = 0.029  # cavity spectrum PRESERVED (vs DOF-elim 1.64%)
projection_port_sheet_mode_deflated_pct = 6.88  # was projection_junction_mode_deflated_pct; 17.49 GHz mode removed (ungauged 0.00%)
projection_port_sheet_divergence_ratio = 5.0173e1  # was projection_junction_divergence_ratio; ‖GᵀMx‖/‖x‖_M of the UNGAUGED 17.49 GHz eigenvector (near-gradient; qubit mode = 6.18e-15)
projection_port_sheet_projected_norm_ratio = 1.0638e-4  # was projection_junction_projected_norm_ratio; ‖Px‖_M/‖x‖_M ≈ 0 → P deflates the 17.49 GHz mode
followon_issue = 514  # Port-aware divergence-free projection — eigen-gauge saga, chapter 3
#
# PORT-AWARE PROJECTION — issue #514 (measured 2026-07-14): construction
# (b2), deflate image(d⁰) ⊖ span{û}. The bulk projector deflates the 17.49 GHz
# mode because that mode is 99.99% gradient (projected-norm ratio 1.0638e-4
# above); the port-aware projector re-admits exactly that one direction with
# a rank-1 M-orthogonal update:
#   P' = P + û ûᵀ M,   û = (I−P)x_sheet / ‖(I−P)x_sheet‖_M,
# where x_sheet is the ungauged 17.49 GHz eigenvector (extracted by a small
# ungauged shift-invert solve near 17.49 GHz; participation-selected). P' is a
# genuine M-orthogonal projector onto (divergence-free subspace) ⊕ span{û}:
# identity on the cavity modes AND on that flux direction, annihilator of the
# other 13,746 gradient directions (algebra unit-tested in eigen::projection:
# port_aware_projector_readmits_one_gradient_direction,
# port_aware_solve_retains_the_gradient_mode). This is a COMPOSITE solver
# (one ungauged extract + one port-aware band solve), shipped via
# crate::eigen::projection::solve_transmon_eigenmodes_port_aware. Pinned in
# tests/transmon_eigenmode.rs::real_transmon_port_aware_retains_all_six_modes.
#
# RESULT — Palace's six Target-4.5 modes (five cavity modes and the port-sheet
# artifact) all ≤1%, gradient cluster gone (1 near-zero survivor, down from
# 13,747), both prior-negative pin tests (#502, #509) green and unmodified.
# The qubit mode is returned too (it is solenoidal and untouched by P'):
port_aware_solver = "solve_transmon_eigenmodes_port_aware (composite: ungauged 17.49 GHz extract + port-aware band Lanczos with P' = P + û ûᵀ M)"
port_aware_all_six_modes_within_bar = true  # Palace's six Target-4.5 modes, which include the port-sheet artifact
port_aware_worst_case_rel_err_pct = 0.0289  # worst of the six (mode 5.15 GHz)
port_aware_port_sheet_retained_pct = 0.0000   # was port_aware_junction_retained_pct; 17.4901 GHz, p = 1.000 — the #509 deflation undone
port_aware_gradient_cluster_near_zero_modes = 1  # 13,747-mode cluster removed
port_aware_port_sheet_divergence_ratio = 5.017e1  # was port_aware_junction_divergence_ratio; the retained 17.49 GHz mode's div-ratio (O(1), re-admitted gradient flux)


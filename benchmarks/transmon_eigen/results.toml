[port_voltage_a2]
# Issue #1044 (phase P2 of the #1003 spike): the opt-in rank-1 port-voltage
# junction shunt A2, K_port = (1/L~) b b^T, M_port = C~ b b^T, with
# b = assemble_port_flux / w the uniform port-voltage functional
# (crate::eigen::transmon::LumpedPortVoltageShunt, selected by
# JunctionPortModel::PortVoltage). Same fixture, element values, PEC and
# readout ports as [meta]. The default LumpedReactiveShunt (distributed S_Gamma)
# and every number above are unchanged.
#
# MEASURED (committed test, local CPU, no cloud):
#  - max|G^T b| = 0 exactly, so G^T K_port = G^T M_port = 0 and the plain bulk
#    MOrthogonalGradientProjector is exact under A2;
#  - A2 + the plain bulk projector at sigma = 4.5 GHz, N = 6 returns the six
#    modes below in one factorization, residuals <= 1e-8, with NO Palace
#    frequency filter. The only filter is the reference-free exact-null cut of
#    smallest_nonnull_eigenpairs (issue #950), which drops one lambda = -4.0e-20
#    pair (ceiling 1.19e-12);
#  - A2 ungauged at sigma = 17.5 GHz, N = 8: no mode between 15.464979 and
#    18.692705 GHz. The shipped shunt has its 17.490109 GHz mode there
#    ([modes.port_sheet_artifact]).
# Every A2 mode agrees with the shipped shunt to 4 decimals; the qubit mode is
# 3.452753 GHz against 3.452751 (+6e-5 %).
#
# INFERENCE, not measured here: the removed 17.49 GHz mode is the sheet-internal
# LC resonance of the distributed S_Gamma (zero port voltage, design note §3.1),
# so A2 cannot shift a mode whose port field is uniform. The synthetic test
# port_voltage_shunt_removes_zero_voltage_patch_modes_synthetic supports this
# (one zero-voltage S_Gamma mode per free patch node, each an A2 null vector).
# P3 (#1045) re-baselined the classification on this evidence and #1043:
# [modes.qubit] and [modes.port_sheet_artifact].
status = "measured"
measured_date = "2026-10-11"
issue = 1044
test = "crates/geode-core/tests/transmon_eigenmode.rs::real_transmon_port_voltage_a2_bulk_projector_n6"
command = "cargo test -p geode-core --release --test transmon_eigenmode -- --ignored --exact real_transmon_port_voltage_a2_bulk_projector_n6 --nocapture"

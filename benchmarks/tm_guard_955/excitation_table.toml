[meta]
description = "Issue #1032: does a TE10 drive excite the TM-like box modes the TM guards miss on the long Gmsh guides of long_guide_table.toml? Rows: every interim and option-1 miss and 10 option-3-only misses at p=2, every p=1 miss at p=1 (exact classifier), six non-miss rows, and two structured controls (a y-mirror-symmetric guide, symmetry-forbidden; an E-plane height step, known excited). Wave ports on both end faces carry every TE face mode below the top of the scan; TE10 is driven at port 1 (evanescent below its cutoff). The scan runs from k_ref (1 - 0.05) to the larger of k_ref (1 + 0.05) and every missing guard in relative steps of 2.5e-4. Verdicts: excited = some scan point has a driven exact E_z share above its sliding median by > 0.01, an S11/S21 residual against a local cubic > 1e-3, or a projection of the driven field on the reference mode > 0.1; weak = none does but a golden-section zoom (8 seeds, to 1e-12) finds a resonance with excess share > 0.01; not_excited = neither. The projection criterion was added after the run, when the height-step control failed the other two (a broadband conversion); *_prereg is the verdict without it. bracket_* over k_ref (1 +- 0.05); band_<guard> = [verdict, guard, max excess share, max S residual, max projection, resonances, verdict_prereg] over [k_ref (1 - 0.05), guard]. Resonances are [k, share, excess share, projection on the reference mode, relative width at excess 0.01 (0 = below f64 resolution), width clipped by the scan]. length_change is NaN where TE10 propagates nowhere in the bracket."
backend = "ndarray"

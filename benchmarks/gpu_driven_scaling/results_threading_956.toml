[threading_fix_956.end_to_end]
note = "The whole solve on main, ungated (the first fix commit: sequential at every size) and fix (shipped: sequential up to sequential_solve_max_dim unknowns), one process per leg. Above the limit fix takes no scope, so it runs as main does and was not rerun there; below it fix and ungated make the same change. complex: SparseComplexShiftInvertLanczos::default().smallest_eigenpairs (20 modes) on the lossy P1 pencil; timed region = factorization + Lanczos loop. ams: matrix-free shift-invert Lanczos with the three-space AMS inner preconditioner and GEODE_COARSE=direct, on the synthetic transmon cavity of tests/transmon_eigenmode.rs (4 modes, sigma = -0.5); timed region = the eigensolve. transient: TransientSolver::run (400 steps at mesh_n 16, 200 at 24) of generalized-alpha (rho_inf = 1) on the parallel-plate lumped-port fixture; timed region = run (factorization + steps), factor_* = one factorization alone. *_user_s and *_sys_s are getrusage deltas around the timed region."


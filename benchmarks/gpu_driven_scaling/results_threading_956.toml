note = "PR #1010 review: every other table in this file was measured on the faier 0.24.4 git pin ([meta].faer); the tree that ships is on crates.io faier 0.25.2. These are the 8-thread per-call legs again on that tree, at sizes either side of sequential_solve_max_dim, three repeats each, same harness and same pool / seq protocol as [[threading_fix_956.per_call]]. The build is tree_commit with gate_off.patch, which sets SEQUENTIAL_SOLVE_MAX_DIM to 0 so that the pool mode of the transient leg is not itself scoped (the complex and ams legs call the LU directly and do not depend on it). The default pool, 1 thread and the end-to-end legs were NOT rerun on 0.25.2."

issue = 956
measured_date = "2026-10-09"
main_commit = "c6f187643d40fa1c4ca0e6798e3f1ca60fa004d3"
ungated_commit = "885e2cc16b3ba95fed41260b2a9ba6a2cf87ec89"  # scope at every size; superseded

logical_cpus = 28
os = "Darwin 27.0.0"

[threading_fix_956]
note = "Per-call cost of each site's triangular solve on the MAIN build: the same solve on the ambient parallelism (pool, what main does) and under a SequentialSolveScope (seq, what the fix does). complex: the complex LU of the lossy scalar P1 pencil K(1 + 0.02i) on cube_tet_mesh(n), sigma = 0, as in the Lanczos loop. ams: the real LU of the SPD P1 operator K + 0.5 M, standing in for the nodal coarse operator G^T(K + |sigma|M)G of about the same node count (that operator is not public). transient: TransientStepper::step on the parallel-plate lumped-port fixture of tests/transient_sparams.rs, two steppers advanced in lockstep, one per mode; dofs counts interior edges. threads = RAYON_NUM_THREADS (default = unset)."


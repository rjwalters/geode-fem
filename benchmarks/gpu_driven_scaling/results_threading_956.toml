# Issue #956: repeated small sparse triangular solves on the rayon pool.
# GENERATED by benchmarks/gpu_driven_scaling/summarize_threading_956.py from
# benchmarks/gpu_driven_scaling/runs/2026-10-09_local_threading_956; do not edit by hand.
#
# Three loops called faer's Lu::solve_in_place once per iteration or step
# with faer's process-global parallelism at its default (every core):
#   complex   eigen/complex/lanczos.rs, the complex shift-invert Lanczos loop
#   ams       eigen/ams.rs lu_solve, the AMS coarse LU solve (Direct coarse
#             solver, and the coarsest level of Amg)
#   transient driven/transient.rs TransientStepper::step, once per time step
# The fix runs each under a SequentialSolveScope (Par::Seq).
#
# HOW TO READ: a developer machine shared with other work. Wall times move
# with the load, so the 1-minute load average is recorded for every leg and
# legs started above 100 are excluded from the summaries. In the
# per-call tables pool and seq alternate in blocks of 20 calls inside one
# process, so the two modes of a leg see the same load; the medians are
# over 400 calls per mode (200 steps for transient). cpu_per_call_us is
# (user + sys) CPU over the timed calls divided by the call count.


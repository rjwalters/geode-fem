#
# ---------------------------------------------------------------------------
# READ FIRST
#   * LOCAL DEV-MACHINE SUBSET. This is NOT the #520 sweep and NOT a benchmark
#     host: a developer Mac that was running other builds at the same time
#     (1-minute load average and per-process CPU% are recorded per cell).
#   * ITERATION COUNTS are the load-independent result. TIMES ARE INDICATIVE
#     ONLY, single samples, and must not be placed next to the Lambda A100 /
#     Palace cells of results_large_a100.toml: different host, different
#     load, different core count.
#   * THE [[cell]] TABLES USE THE DEFAULT THREADING, and their AMS timings at
#     the larger sizes are mostly kernel time (process_sys_s): the V-cycle's
#     small triangular solves fan out to the rayon pool on an oversubscribed
#     host. Every time RATIO in this file comes from the RAYON_NUM_THREADS=1
#     rerun in [[single_thread_cell]] / [[single_thread_comparison]].
#   * THAT CONTENTION IS FIXED (issue #946). The [[cell]] tables predate the
#     fix: they are the build named in [meta]. [threading_fix] has the
#     before / after measurement, on the same loaded machine.
#   * THE [[cell]] AND [[single_thread_cell]] TABLES MEASURE THE SHIPPED AMS
#     (edge-smoother weight 0.6). [diagnostics] shows that weight is above the
#     damped-Jacobi stability bound on this fixture and that the iteration
#     growth goes away below it. Read [finding].scope before quoting a result.
#   * THAT WEIGHT IS NO LONGER FIXED (issue #945). The AMS now lowers it where
#     a spectral-radius estimate proves 0.6 unstable, which it does on this
#     fixture. [[cell]], [[single_thread_cell]], [finding], [threading_fix] and
#     [diagnostics] all predate that and are kept as the record of the old
#     weight. [smoother_weight] has the before / after measurement, two more
#     frequencies, and the tests outside this fixture.
#   * No Palace run and no size above the largest one listed here. See

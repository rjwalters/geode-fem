[smoother_weight]
issue = 945
note = "Before / after measurement of the issue #945 fix, on the fixture of this file. Before: the AMS V-cycle's damped-Jacobi edge smoother used the fixed weight 0.6. After: each preconditioner build takes 30 steps of plain Lanczos on D^-1/2 P D^-1/2 (P the real proxy the V-cycle smooths, D its diagonal) and a Gershgorin row-sum bound g, and uses 0.6 if 0.6 * theta < 2, else 1.5 / min(1.1 * theta, g), theta being the largest Ritz value. Nothing else differs between the builds. One ams_cpu_sweep.sh tree per build and frequency, one process per leg."
guaranteed = "theta is a lower bound on lambda_max(D^-1 P) and g an upper bound. So 0.6 * theta >= 2 proves that 0.6 is at or above the stability bound 2 / lambda_max: the weight is lowered only where the old one is proven unstable, and is exactly 0.6 everywhere else. A lowered weight is below 2 / lambda_max when g is the smaller term of the minimum, and in any case when 1.5 / rho_hat < 2 / g, which the cells below let you check."
heuristic = "1.1 is an allowance for what 30 Lanczos steps have not resolved, not a bound. Where 1.1 * theta is the smaller term, the lowered weight is below 2 / lambda_max only if lambda_max < 1.47 * theta. And a weight kept at 0.6 is not thereby shown stable: the Ritz value only failed to prove it unstable (it is proven stable only if g < 10/3). ritz_gap_rel in [[smoother_weight_comparison]] is the measured shortfall of the 30-step theta against a 1000-step Lanczos run, itself a lower bound."
how_to_read = "Developer machine, single samples. Iteration counts are the result. process_user_s + process_sys_s is the CPU cost of the whole process (mesh, assembly, setup, solve); wall-clock times (setup_s, krylov_s) depend on the load at that moment and are not compared between legs. main has no GEODE_SCALING_OMEGA knob, so away from omega = 0.10 the 'before' is the fix build with the weight forced back to 0.6; at omega = 0.10 both were run and main_equals_forced_0p6 says whether they agree."
run_dir = "benchmarks/gpu_driven_scaling/runs/2026-10-08_local_ams/smoother_945"
trees = ['fix_w0p05', 'fix_w0p10', 'fix_w0p10_rayon1', 'fix_w0p20', 'main_w0p10', 'w060_w0p05', 'w060_w0p10', 'w060_w0p20']

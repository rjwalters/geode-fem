smooth_weight_reading = "The result is robust to the weight, not a narrow sweet spot: every weight run from 0.2 to 0.55 (6 values, contiguous) gives 25 to 58 iterations across the six sizes, and the weights that degrade (0.58, 0.6, 0.65) are the ones next to and above the damped-Jacobi stability bound 2 / rho = 0.585. The estimate of rho(D^-1 P) is 3.39 to 3.42 over the six sizes, so the bound does not move with refinement, and 0.6 * 3.39 = 2.03 > 2 at every size: the shipped smoother amplifies the top edge modes, and their number grows with the mesh. That the count already rises just below the bound fits the same picture (there the symmetrized smoother is nearly singular on those modes), but this mechanism was inferred from the threshold, not verified mode by mode. The comment on DEFAULT_SMOOTH_WEIGHT in eigen/ams.rs says 0.5; the constant is 0.6. Single runs of an uncommitted patch on one fixture: this identifies the cause here and does not validate a replacement value."


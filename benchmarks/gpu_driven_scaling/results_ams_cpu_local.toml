[threading_fix.finding]
largest_size_edges = 102024
contention = "At 102024 edges with the default threading, the AMS leg's kernel time went from 646 s before the fix to 1.1 to 1.2 s after it, and its user time from 174 s to 102 to 110 s. With RAYON_NUM_THREADS=1 the kernel time was 0.6 s before and 0.7 s after. The scope changes nothing but faer's global parallelism during the Krylov solve, and the only faer calls in that solve are the two lu_solve calls per iteration, so the contention was in those calls."
cost = "CPU time per AMS iteration at 102024 edges, whole process: 371 ms before the fix with the default threading and 44 ms with RAYON_NUM_THREADS=1; after the fix 45 to 49 ms with the default threading and 44 to 47 ms with RAYON_NUM_THREADS=1. After the fix the two modes run the same sequential code, so the spread between them and between repeats is the host, not the solver. Wall-clock times were not comparable in this session (see how_to_read), so no wall-clock speedup is quoted."
fix_result_identical_across_threading_at_every_size = true
results = "After the fix the default-threading and RAYON_NUM_THREADS=1 legs agree in iteration count, explicit residual and port voltage to every printed digit at every size. Before the fix they did not: the parallel and the one-thread triangular solve differ in roundoff, and at the shipped smoother weight a slowly converging solve amplifies that into a different iteration count. For the same reason the fix build does not reproduce either main iteration count exactly: faer's Par::Seq solve differs in roundoff from its Par::rayon solve even on one thread. Every leg met the same 1e-8 explicit-residual tolerance, and the port voltages of the two builds agree to the fix_port_v_rel_diff_* values above."
not_measured = "An idle host; whether a parallel triangular solve would pay at node counts far above the 102024-edge case; the AMS setup, whose coarse factorization still runs at the caller's thread count; and concurrent solves (the CLI's --jobs)."

[threading_fix.eigen_loop]
note = "The same pattern in the direct shift-invert Lanczos loop (eigen/lanczos.rs): one sparse triangular solve per step, on faer's global parallelism. Measured with a throwaway test (eigen_loop/diag946_eigen_loop.rs, NOTE.txt), not part of the benchmark: a scalar P1 pencil on cube_tet_mesh, SparseShiftInvertLanczos::default(). solve_user_s and solve_sys_s are getrusage deltas around the eigensolve alone (factorization plus Lanczos loop). One retained sample per row, same loaded machine; NOTE.txt lists the repeats."
run_dir = "benchmarks/gpu_driven_scaling/runs/2026-10-08_local_ams/threading_946/eigen_loop"
mesh_n = 30
dofs = 24389
modes_requested = 20


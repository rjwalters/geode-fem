sizes_n_where_ams_solve_was_faster_than_jacobi = []  # shipped AMS, single-threaded rerun, loaded machine: indicative only
scope = "Everything in verdict, convergence and cost is a statement about the SHIPPED AMS (edge-smoother weight 0.6) on this one fixture at omega = 0.10. It is not a statement about AMS preconditioning in general: see cause."
verdict = "The shipped AMS converged at every size but its iteration count is NOT flat on this fixture: 70 iterations at 1854 edges, 2209 at 102024 (max/min 31.56, outside the 1.52 band of the #742 / #744 spiral measurement). It grows as edges^0.86 by the endpoint fit (edges^0.91 by least squares over all 6 sizes), against edges^0.47 for Jacobi (least squares 0.47; 807 to 5259). It needs 11.5x fewer iterations than Jacobi at the smallest size and 2.4x fewer at the largest."
convergence = "No plateau and no drift: every AMS solve met the 1e-8 tolerance on the explicit residual (worst 9.1e-09) and matches the Direct solution. The degradation is in the iteration count as the mesh is refined, not a stall of the kind recorded in benchmarks/transmon_ams_minres_133k/results.toml. Only omega = 0.10 was run, so nothing here says how the count depends on frequency."
cost = "Single-threaded (RAYON_NUM_THREADS=1), one shipped-AMS iteration cost 18x to 26x a Jacobi iteration, and the shipped-AMS solve (setup + Krylov) took 1.7x to 11.1x as long as the Jacobi solve; it was faster at 0 of 6 sizes. Loaded dev machine, single samples: the direction is clear at the larger sizes, the factors are indicative."
sizes_n_with_contended_default_threading_ams_leg = [15, 20, 24]
thread_contention = "The default-threading AMS timings in [[cell]] at these sizes are NOT the cost of AMS. The V-cycle does two small sparse triangular solves per iteration (lu_solve in eigen/ams.rs, faer solve_in_place under the global parallelism setting), which fan out to the rayon pool; on this oversubscribed host that became kernel time. The worst leg, n24_ams, used 168 s user and 487 s sys for a 274 s Krylov solve; the same solve with RAYON_NUM_THREADS=1 took 93 s with 0.5 s sys. No time ratio in this file uses the default-threading legs. Whether the parallel solve helps on an idle host was not measured."
cause = "Identified, by a one-off diagnostic on this fixture (see [diagnostics]): the edge smoother weight. The shipped damped-Jacobi weight 0.6 is above the stability bound 2 / rho(D^-1 P) = 0.585 measured here (rho >= 3.42), so the smoother amplifies the highest edge modes. With the weight anywhere from 0.2 to 0.55 the same solve takes 25 to 58 iterations at every size. This is a throwaway patch, single runs, one fixture and one frequency; no weight was validated on any other problem and the library constant is unchanged."
not_established = "Not established: (1) why the shipped weight holds a flat count on the #742 / #744 spiral and not here. A plausible reason is the mesh (this fixture is a structured Kuhn-tet cube, the spiral an unstructured mesh, and rho(D^-1 P) depends on the mesh), but the spiral was NOT rerun and its rho was NOT measured, so this is untested. (2) What a lower weight does on the spiral or the transmon AMS tests. (3) The dependence on frequency: only omega = 0.10 was run. (4) Anything above the largest size listed. No AMS setting was varied in the [[cell]] and [[single_thread_cell]] tables (AmsCoarseSolve::Auto throughout). Palace's ~5 iterations use a different Krylov method (GMRES) and a different AMS (hypre) and were not rerun here."


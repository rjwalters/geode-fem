[finding]
sizes_edges = [1854, 5859, 13428, 25695, 59660, 102024]
jacobi_iterations = [807, 1463, 2167, 2969, 4303, 5259]
ams_iterations = [70, 139, 307, 533, 1741, 2209]
ams_all_explicit_converged = true
ams_iterations_max_over_min = 31.56
flat_threshold_max_over_min = 1.52  # the band of the #742 / #744 spiral measurement (102 to 155 iterations)
ams_iteration_count_flat = false
ams_growth_exponent_endpoint = 0.861  # iterations ~ edges^p, from the smallest and largest size only
ams_growth_exponent_least_squares = 0.912  # slope of log(iterations) on log(edges), all sizes
jacobi_growth_exponent_endpoint = 0.468
jacobi_growth_exponent_least_squares = 0.470
sizes_n_where_ams_solve_was_faster_than_jacobi = []  # shipped AMS, single-threaded rerun, loaded machine: indicative only
scope = "Everything in verdict, convergence and cost is a statement about the SHIPPED AMS (edge-smoother weight 0.6) on this one fixture at omega = 0.10. It is not a statement about AMS preconditioning in general: see cause."
verdict = "The shipped AMS converged at every size but its iteration count is NOT flat on this fixture: 70 iterations at 1854 edges, 2209 at 102024 (max/min 31.56, outside the 1.52 band of the #742 / #744 spiral measurement). It grows as edges^0.86 by the endpoint fit (edges^0.91 by least squares over all 6 sizes), against edges^0.47 for Jacobi (least squares 0.47; 807 to 5259). It needs 11.5x fewer iterations than Jacobi at the smallest size and 2.4x fewer at the largest."
convergence = "No plateau and no drift: every AMS solve met the 1e-8 tolerance on the explicit residual (worst 9.1e-09) and matches the Direct solution. The degradation is in the iteration count as the mesh is refined, not a stall of the kind recorded in benchmarks/transmon_ams_minres_133k/results.toml. Only omega = 0.10 was run, so nothing here says how the count depends on frequency."
cost = "Single-threaded (RAYON_NUM_THREADS=1), one shipped-AMS iteration cost 18x to 26x a Jacobi iteration, and the shipped-AMS solve (setup + Krylov) took 1.7x to 11.1x as long as the Jacobi solve; it was faster at 0 of 6 sizes. Loaded dev machine, single samples: the direction is clear at the larger sizes, the factors are indicative."
sizes_n_with_contended_default_threading_ams_leg = [15, 20, 24]
thread_contention = "The default-threading AMS timings in [[cell]] at these sizes are NOT the cost of AMS. The V-cycle does two small sparse triangular solves per iteration (lu_solve in eigen/ams.rs, faer solve_in_place under the global parallelism setting), which fan out to the rayon pool; on this oversubscribed host that became kernel time. The worst leg, n24_ams, used 168 s user and 487 s sys for a 274 s Krylov solve; the same solve with RAYON_NUM_THREADS=1 took 93 s with 0.5 s sys. No time ratio in this file uses the default-threading legs. Whether the parallel solve helps on an idle host was not measured. Fixed in issue #946 after these legs were run: see [threading_fix]."
cause = "Identified, by a one-off diagnostic on this fixture (see [diagnostics]): the edge smoother weight. The shipped damped-Jacobi weight 0.6 is above the stability bound 2 / rho(D^-1 P) = 0.585 measured here (rho >= 3.42), so the smoother amplifies the highest edge modes. With the weight anywhere from 0.2 to 0.55 the same solve takes 25 to 58 iterations at every size. This is a throwaway patch, single runs, one fixture and one frequency; no weight was validated on any other problem and the library constant is unchanged."
not_established = "Not established: (1) why the shipped weight holds a flat count on the #742 / #744 spiral and not here. A plausible reason is the mesh (this fixture is a structured Kuhn-tet cube, the spiral an unstructured mesh, and rho(D^-1 P) depends on the mesh), but the spiral was NOT rerun and its rho was NOT measured, so this is untested. (2) What a lower weight does on the spiral or the transmon AMS tests. (3) The dependence on frequency: only omega = 0.10 was run. (4) Anything above the largest size listed. No AMS setting was varied in the [[cell]] and [[single_thread_cell]] tables (AmsCoarseSolve::Auto throughout). Palace's ~5 iterations use a different Krylov method (GMRES) and a different AMS (hypre) and were not rerun here. Items (1) to (3) were measured afterwards, in issue #945: see [smoother_weight]."

[threading_fix]
issue = 946
note = "Before / after measurement of the issue #946 fix. Before (build = main): faer's Lu::solve_in_place, called twice per COCG iteration by the AMS V-cycle (lu_solve in eigen/ams.rs), took its thread count from faer's process-global parallelism, by default every core. After (build = fix): the SolverMode::Iterative back-solve holds a SequentialSolveScope for the whole Krylov solve when the preconditioner is AMS, so those solves run with Par::Seq. Nothing else differs between the two builds. Each build was run with the default threading and with RAYON_NUM_THREADS=1, by ams_cpu_sweep.sh with SKIP_XCHECK=1, one process per leg."
how_to_read = "LOADED DEVELOPER MACHINE, single samples. process_user_s and process_sys_s are the signal. Wall-clock times (krylov_s, setup_s, process_wall_s) are NOT comparable between legs: the load average changed by a factor of several during the session, and a leg whose process_cpu_pct is well under 100 on one thread was waiting for a CPU, not computing. process_* covers the whole process: mesh, assembly, setup and solve."
run_dir = "benchmarks/gpu_driven_scaling/runs/2026-10-08_local_ams/threading_946"
trees = ['main_default', 'main_rayon1', 'fix_default', 'fix_default_rep2', 'fix_rayon1', 'fix_rayon1_rep2']

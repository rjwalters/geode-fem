# Larger-mesh GPU-vs-CPU driven-solve sweep + geode-vs-Palace driven
# head-to-head (issue #520, Epic #476). Same physical fixture and solver
# configs as benchmarks/gpu_driven_scaling/results.toml (#501), extended from
# 25.7k to 463k edges, all legs on ONE rented host in ONE session
# (2026-10-07/08). Hand-transcribed from summarize_520.py output over
# runs/2026-10-07_lambda_a100/ (raw per-leg stdout, /usr/bin/time -v,
# nvidia-smi polls, Palace logs); every number below is measured unless
# labelled "projected".
#
# ---------------------------------------------------------------------------
# HARDWARE CAVEAT — READ FIRST
#   #520 was written for the L40S (AWS g6e) of results.toml. This ran on
#   Lambda Cloud on an NVIDIA A100-SXM4-40GB (sm_80), host AMD EPYC 7J13
#   30 vCPU. It is NOT comparable cell-for-cell with results.toml (L40S,
#   4-vCPU EPYC 7R13 host): different GPU (A100 has ~1.8x the memory
#   bandwidth and ~7x the FP64 of the L40S, but the geode GPU leg is f32,
#   where the L40S is nominally faster), different host CPU, and a different
#   matrix-free local apply (see [code]). The n=15 overlap point shows the
#   size of the difference: GPU f32 35.7 ms/iter here vs 28.0 ms/iter on the
#   L40S; CPU matrix-free f64 29.8 ms/iter here vs 27.6 ms/iter there.
# ---------------------------------------------------------------------------

[meta]
issue = 520
measured_date = "2026-10-07"
fixture = "sigma-lossy parallel-plate cube, single LumpedPort (e_hat = y, R = 1), eps_r = 1, sigma = 2.0, PEC on y-planes (crates/geode-core/tests/gpu_driven_scaling.rs) — identical to results.toml"
omega = 0.10
iter_tol_f64 = 1e-8
iter_tol_f32 = 1e-6
geode_commit = "main d51b4b6e + this PR's diff (harness knobs, drift classification, TF32-free matvec); the box checkout's diff stat is in runs/2026-10-07_lambda_a100/geode_checkout.txt"
statistic = "single timed solve per cell (GEODE_SCALING_REPS=0: the warm-up solve is the measurement) unless noted; Palace cells n=3 at 59.7k and 463k edges"
reps_note = "REPS=0 because one CPU matrix-free solve at 102k edges takes 13.5 min. The warm-up includes one-time GPU kernel JIT/autotune: at 25.7k edges it was 109.3 s warm-up vs 106.8 s for a timed repeat (2.3%), so warm-up times are at most a few % pessimistic for the GPU."

[hardware]
provider = "Lambda Cloud (on-demand), instance gpu_1x_a100_sxm4, us-east-1"
gpu = "NVIDIA A100-SXM4-40GB, 40960 MiB, compute capability 8.0, driver 570.148.08"
cpu = "AMD EPYC 7J13, 30 vCPU (VM)"
ram_gib = 216
os = "Ubuntu 22.04.5 LTS (Lambda Stack), kernel 6.8.0-60-generic"
rustc = "1.99.0"
cuda_note = "Lambda Stack keeps the CUDA headers in /usr/include, so the cubecl NVRTC compile needs CUDA_PATH=/usr (box_sweep.sh sets it)"

[code]
matvec = "The matrix-free local apply was changed in this PR from a Burn matmul to broadcast-multiply + sum_dim (crates/geode-core/src/assembly/nedelec_matvec.rs). On this A100 the stock autotuned f32 matmul ran as TF32 (cubek-matmul stages f32 CMMA operands as tf32) and the f32 COCG stagnated at relative residual 0.163 after 20000 iterations already at n=6 (1854 edges); with the change, the same solve's recursion converges in 782 iterations (L40S stock: 770). Evidence: runs/.../tf32_evidence/. Issue #926 tracks the remaining f32 matmul sites."
matvec_cpu_effect = "ndarray f64, 13.4k edges, same host: stock matmul 42.48 s/solve (2185 iters) vs new form 31.50 s (2142 iters) — no CPU regression (runs/.../ab/ and ab_new_matvec_n12.*)."
drift = "Since issue #744 the driven solver rejects a Krylov solve whose recursion met tol but whose explicitly recomputed residual did not. Every f32 GPU solve here ends that way (explicit residual 5e-3..2e-2 > 1e-6). The harness times it as a completed solve and records converged = false, recursion_converged = true; residual_rel is the EXPLICIT residual. The #501 L40S cells predate #744 and were the same kind of solve reported as converged."

# ---------------------------------------------------------------------------
# 1. CROSSOVER: GPU f32 vs CPU f64, SAME matrix-free algorithm (BurnCocg +
#    Jacobi), same host. s/iter for full solves = solve_s / iterations; for
#    the 300-iteration capped cells it is NET of per-omega setup:
#    (t_cap300 - t_cap1) / 299, with t_cap1 measured separately
#    (S1_/S2_ legs). The CPU matrix-free leg (Burn ndarray backend) runs on
#    ONE core (/usr/bin/time: 100% CPU); the GPU leg's host process 109%.
#
# | edges   | GPU f32 A100: s/iter | iters  | expl. resid | solve s | CPU f64 1-core: s/iter | iters | solve s | GPU/CPU per-iter |
# |---------|----------------------|--------|-------------|---------|------------------------|-------|---------|------------------|
# |  25 695 | 0.0357 (timed rep)   |  2 989 | 5.5e-3      |  106.8  | 0.0298                 | 2 907 |   86.5  | 1.20 (GPU slower)|
# |  59 660 | 0.0792               |  4 503 | 1.4e-2      |  356.8  | 0.0844                 | 4 235 |  357.5  | 0.94             |
# | 102 024 | 0.1619               | 20 000 DNF | 2.1e-2 (recursion stagnated) | 3237.4 (DNF) | 0.1548          | 5 249 |  812.7  | 1.05             |
# | 197 190 | 0.3214 (net, cap300) |   –    |   –         |   –     | 0.4782 (net, cap300)   |   –   |   –     | 0.67             |
# | 462 520 | 0.7578 (net, cap300) |   –    |   –         |   –     | 1.4586 (net, cap300)   |   –   |   –     | 0.52             |
#
# MEASURED CROSSOVER (per-iteration cost): GPU f32 and 1-core CPU f64 are at
# parity (within +-6%) from ~60k to ~100k edges; above that the GPU is
# cheaper per iteration, 1.5x at 197k and 1.9x at 463k edges.
#
# NO CROSSOVER IN TIME-TO-SOLUTION: the f32 GPU solve never meets the
# explicit-residual tolerance (5e-3..1.4e-2 vs the f64 legs' ~9e-9), and at
# 102k edges and above its recursion no longer converges at all (DNF at
# 20000 iterations, stagnated at 2.1e-2). Wall-clock is at parity at 60k
# edges (356.8 s vs 357.5 s) only because the GPU needs 6% more iterations to
# reach a 6-orders-looser answer. So the per-iteration crossover exists but
# is unusable: in the range where the GPU is cheaper per iteration, f32 COCG
# does not converge. This confirms and sharpens the #501 / July note: the
# limiter is f32 convergence, not GPU throughput.
#
# Also measured: the GPU path is far from saturating the A100. Peak device
# memory was 1447 MiB at 463k edges (of 40 GB, so the memory ceiling is not
# the limit), and at 102k edges nvidia-smi showed 95% "utilization" at
# 72 W of a 400 W TDP — the cost is latency-bound gather/scatter kernels,
# not arithmetic.
# ---------------------------------------------------------------------------

[crossover]
per_iteration = "parity (within +-6%) at ~60k-100k edges; GPU cheaper above: 1.5x at 197k, 1.9x at 463k edges"
time_to_solution = "none measured: f32 never meets the explicit-residual tol, and the f32 recursion does not converge at >= 102k edges"
memory_ceiling = "not reached: GPU peak 1447 MiB at 463k edges (40 GB card); host RSS of the GPU test process 2.3 GB"
escalation = "A larger GPU would not change this outcome — the blocker is f32 COCG convergence (and a latency-bound Burn gather/scatter apply), not capacity. The levers are f64 (or mixed-precision / iterative-refinement) on device, and a better preconditioner (see section 3)."


# ---------------------------------------------------------------------------
# 3. geode vs Palace DRIVEN head-to-head (Palace fba6a5b, the CUDA image of
#    #519, same host). The geode harness exports the IDENTICAL mesh as Gmsh
#    MSH 2.2 (GEODE_SCALING_EXPORT_DIR); palace_driven_cfg.py maps geode's
#    natural units to SI (L0 = 1 m: f = 4.7713 MHz, sigma = 2/Z0 S/m,
#    R = Z0). Palace: Order 1, Linear Type Default (GMRES + AMS), Tol 1e-8.
#
# CORRECTNESS: Palace's port voltage V/V_inc agrees with geode's f64 solve
# to 2.2e-9 .. 2.8e-9 relative at every size (25.7k .. 463k edges), on both
# Palace devices — same discretization, same answer. (Validated first at
# 1854 edges: Palace S11 = -9.5232 dB / 178.739 deg vs geode V/V_inc - 1.)
#
# | edges   | geode-CUDA f32 MF        | geode CPU f64 best (COCG-CSR, 1 core) | Palace GPU (1 rank, A100) | Palace CPU (8 ranks) |
# |---------|--------------------------|---------------------------------------|---------------------------|----------------------|
# |  25 695 | 106.8 s (resid 5.5e-3)   |   4.0 s                               | 10.14 s                   |  3.19 s              |
# |  59 660 | 356.8 s (resid 1.4e-2)   |  14.0 s                               | 17.29 +- 0.11 s (n=3)     |  6.80 +- 0.04 s (n=3)|
# | 102 024 | DNF (3237 s, 20k iters)  |  30.0 s                               | 28.03 s                   | 11.31 s              |
# | 197 190 | (cap only)               |  80.6 s                               | 55.71 s                   | 22.65 s              |
# | 462 520 | projected ~7 700 s, would not converge (0.758 s/iter x ~10 154 iters) | 274.5 s | 165.36 +- 0.49 s (n=3) | 60.12 +- 0.10 s (n=3) |
#
# HEAD-TO-HEAD VERDICT: at the largest size where geode-CUDA completes a
# (recursion-converged) solve, 59.7k edges, Palace-GPU is 20.6x faster
# (17.3 s vs 356.8 s) AND reaches f64 tol 1e-8 (geode-CUDA's explicit
# residual is 1.4e-2). At 463k edges geode-CUDA cannot finish; Palace-GPU
# takes 165 s. The decisive difference is the preconditioner, not the
# device: Palace's GMRES + AMS converges in 5 iterations at 463k edges,
# geode's Jacobi-COCG needs ~10 000. Palace on 8 CPU ranks beats Palace on
# the GPU at every size here too (2.5-3.2x).
# ---------------------------------------------------------------------------

[palace_driven]
palace_commit = "fba6a5b9d17ef09db2907e9c4c6f92d123d131c0"
image = "palace:cuda from reference/palace/docker/Dockerfile.cuda (#519 build, CUDA_ARCH=80)"
backend_gpu = "/gpu/cuda/magma"
backend_cpu = "/cpu/self/opt/blocked"
gmres_iterations_463k = 5
port_v_rel_diff_vs_geode_f64 = { "25695" = 2.18e-9, "59660" = 2.33e-9, "102024" = 2.43e-9, "197190" = 2.60e-9, "462520" = 2.78e-9 }
gpu_wall_s = { "25695" = [10.14], "59660" = [17.41, 17.25, 17.21], "102024" = [28.03], "197190" = [55.71], "462520" = [165.04, 165.12, 165.92] }

[notes]
single_core_cpu = "Both the CPU matrix-free leg and the assembled-COCG leg run single-threaded (Burn ndarray / faer CSR SpMV as used here). The per-iteration crossover above is therefore GPU vs ONE CPU core of the 30 available; against a parallel CPU SpMV the GPU crossover would move further out."

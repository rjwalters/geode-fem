local_jacobi_iterations = [2969, 4303, 5259, 8983, 10154]

[coarse_solve]
decision = "Stopgap: keep the exact sparse LU of the nodal (gradient-space) coarse operator G^T P G, on the host, with the vector-nodal block on 4 symmetric Gauss-Seidel sweeps: AmsCoarseSolve::Auto, the assembled path default. It is O(fill) per apply and serial (two triangular solves per V-cycle), so it is not a GPU design. The coarse solve stays pluggable through IterativePreconditioner::Ams { coarse }: AMG and SGS reach the matrix-free path unchanged (crates/geode-core/tests/driven_matrix_free_ams.rs, matrix_free_ams_coarse_solve_is_pluggable, compares the two paths at each coarse solve)."
drift_744 = "Not re-investigated here. The #744 measurement (AMG / SGS gradient-space solves drift on the driven spiral) stands; an O(nnz) coarse solve that does not drift is the precondition for a GPU-resident AMS."

[deferred]
gpu = "GPU (f64 or mixed precision per #534) on the same fixture against Palace on a GPU: a separate, operator-gated step. The host-side AMS is rejected on non-ndarray-f64 backends."
benchmark_host = "Same-host timings on a dedicated box (r6i.4xlarge, as results_ams_cpu_r6i.toml) and the 898k-edge size: not run (no cloud spend in this change)."
mf_jacobi_full_at_scale = "Matrix-free Jacobi to convergence at 338364 edges (about 25 min projected), 462520 edges (about 39 min projected): not run; per-iteration cost measured from the capped runs instead."

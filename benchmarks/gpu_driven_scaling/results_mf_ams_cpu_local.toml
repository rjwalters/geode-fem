# ---------------------------------------------------------------------------
# READ FIRST
#   * LOCAL DEV-MACHINE RUN, NOT A BENCHMARK HOST: a developer Mac running
#     other builds at the same time (load average per leg is recorded).
#   * ITERATION COUNTS are the load-independent result. TIMES ARE INDICATIVE,
#     single samples; the per-iteration RATIOS are same-host, same-session,
#     single-threaded (RAYON_NUM_THREADS=1 on every leg).
#   * "Matrix-free AMS" = matrix-free Krylov OPERATOR + host-side AMS
#     PRECONDITIONER. The AMS is the assembled path's (assembled real SPD
#     proxy, exact sparse LU of the nodal coarse operator). It is a CPU
#     stopgap, not a GPU-ready preconditioner; see [cost_model] and [deferred].
#   * Matrix-free Jacobi was not run to convergence above 102k edges (about
#     40 min at 463k edges here). Its cost there is MEASURED per iteration from
#     capped runs and its time-to-solution is PROJECTED with the Jacobi
#     iteration count; every projected value is named *_projected.
#   * No GPU, no Palace. Nothing here is a GPU performance claim.
# ---------------------------------------------------------------------------


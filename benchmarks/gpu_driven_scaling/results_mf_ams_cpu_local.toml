[cost_model]
# Per COCG iteration, matrix-free AMS = one matrix-free operator apply and the
# COCG vector updates (as for matrix-free Jacobi) + one host AMS application:
# V-cycles on the real and imaginary parts + one [n] transfer each way.
# remainder_ms = krylov_ms_per_iteration - (ams_vcycle_s + ams_transfer_s) / ams_applies;
# it should track matrix-free Jacobi's per-iteration cost.
n_edges = [25695, 59660, 102024, 338364, 462520]
vcycle_ms_per_apply = [8.283, 22.463, 38.584, 189.908, 234.471]
transfer_ms_per_apply = [0.593, 1.360, 2.174, 7.937, 9.974]
remainder_ms_per_iteration = [12.744, 30.404, 49.712, 178.736, 228.078]
mf_jacobi_ms_per_iteration = [13.317, 36.232, 54.644, 168.313, 230.774]
assembled_ams_ms_per_iteration = [8.374, 22.460, 42.561, 192.182, 244.128]
note = "Per iteration, matrix-free AMS costs 1.94x to 2.58x assembled AMS and 1.50x to 2.24x matrix-free Jacobi on this host: the ndarray matrix-free operator apply (remainder) costs about as much as the whole host V-cycle. The transfers (host memory copies on ndarray) are 2.1% to 2.7% of an iteration. On a GPU the transfer would be a PCIe round trip and the nodal LU triangular solves would stay serial on the host."


# ---------------------------------------------------------------------------
# Palace on the SAME box, same exported meshes, same tolerance (1e-8), the
# config of palace_driven_cfg.py (Order 1), with two values of
# Solver.Linear.Type:
#   Default  what the #520 run used. For a driven problem Palace resolves it
#            to a sparse direct solver when built with one, SuperLU first
#            (palace/utils/iodata.cpp at palace_commit), and this image
#            builds SuperLU. So it is GMRES preconditioned by a SuperLU
#            factorization, NOT AMS. The Palace log does not print the
#            resolved type; this is read from the source and the build
#            flags, and the two types below differ in every measured column.
#   AMS      Palace's auxiliary-space Maxwell solver (hypre). The
#            like-for-like cell for geode's AMS.
# wall_s, user_s, sys_s are /usr/bin/time -v around `palace -np N` inside the
# container, the whole pipeline. The palace_*_s keys are the Avg. column of
# Palace's own Elapsed Time Report, whose rows are exclusive (a nested timer
# pauses its parent; palace/utils/timer.hpp). 'Setup' is the solver's
# SetOperators, 'Preconditioner' is the time inside preconditioner
# applications (ApplyB in palace/linalg/iterative.cpp) and 'Linear Solve'
# is the rest of GMRES. MFEM's hypre and SuperLU wrappers set up or factor
# on their first application, so the AMS setup and the SuperLU
# factorization are most likely inside 'Preconditioner' (not checked
# against the MFEM version Palace pins). palace_linear_solve_total_s, the
# sum of the three, is the only figure compared with geode's solve_s; the
# rows are not split into setup and Krylov here.
# max_rss_one_rank_gb is /usr/bin/time's
# figure, the largest single process. cgroup_peak_gb is the container's
# memory.peak: every rank together, page cache included.
# ---------------------------------------------------------------------------

[palace]
same_host = true
palace_commit = "fba6a5b9d17ef09db2907e9c4c6f92d123d131c0"
changeset_in_log = "v0.17.0-99-gfba6a5b9d"
libceed_backend = "/cpu/self/opt/blocked"
image = "palace:cpu built on the box from palace/Dockerfile.used in the run tree (--build-arg PALACE_REF=<palace_commit>); reference/palace/docker/Dockerfile on main has the same pin and runtime fixes (#927)"
dockerfile_sha256 = "00ddd2956b4f6ecce367871d797545e3795de534ae14b46638368d06ca3771ac"
build_wall_s = "2021"
base_image = "rockylinux@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6"
pinning = "--cpuset-cpus 0 (1 rank) or 0-7 (8 ranks), mpirun -bind-to core, OMP_NUM_THREADS=1"
default_linear_type_resolves_to = "SuperLU (GMRES preconditioned by a sparse direct factorization), from palace/utils/iodata.cpp at palace_commit and PALACE_WITH_SUPERLU=ON in the Dockerfile; not printed in the Palace log"


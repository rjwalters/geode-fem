# Same-box like-for-like transmon eigenmode timing: geode's three routes to
# Palace's six physical modes, and Palace, on one idle AWS m6i.4xlarge in one
# session (issues #927, #763). GENERATED by
# benchmarks/transmon_bench_cpu/summarize_like_for_like_m6i.py from
# benchmarks/transmon_bench_cpu/runs/2026-10-08_m6i_like_for_like/ (do not edit by hand; rerun the script).
#
# ---------------------------------------------------------------------------
# READ FIRST
#   * NO WINNER IS DECLARED HERE. Three geode routes return Palace's six modes;
#     each carries a caveat ([route.*].caveat) and they are reported side by
#     side. Two of the three were tuned against the Palace answer. Which one, if
#     any, a publication may set beside Palace is an operator decision (#927).
#   * A geode cell is like_for_like ONLY in the sense that the six Palace modes
#     are among the modes it returned (each within physical_tol_pct). A route
#     may return non-physical modes beside them ([route.*].non_physical_modes_
#     returned); the six are then picked out with the Palace oracle. Palace's
#     fixture request returns the six and nothing else.
#   * PALACE'S FIXTURE CONFIG WRITES SIX PARAVIEW FIELDS (Save = 6) AND GEODE
#     WRITES NONE. The *_nosave Palace cells (Save = 0) remove that output; both
#     are reported, and every [route.*] gives ratios against both.
#   * PALACE'S TARGET IS A LOWER BOUND, GEODE'S SHIFT IS A CENTRE. For a request
#     at 20 GHz the two solvers return different mode sets ([off_target_request]).
#   * WALL CLOCK AND CORE-SECONDS ARE BOTH GIVEN. core_s = user + sys CPU time
#     of the whole process tree from /usr/bin/time. MPICH ranks busy-wait, so a
#     Palace core_s is close to ranks x wall by construction.
#   * '1 thread' is enforced by the OS (taskset to one CPU), not only requested:
#     see observed_cpus_allowed / observed_tasks_max per cell and [pinning].
#   * ONE MESH (133,108 interior DOFs, first order), ONE HOST, ONE SESSION, and
#     geode's direct LU against Palace's default iterative solver. Nothing here
#     extrapolates to another mesh size; results.toml records that geode's direct
#     path runs out of memory near 1.16M DOFs on this instance type.
# ---------------------------------------------------------------------------

[meta]
issues = [927, 763]
measured_date = "2026-10-08"  # UTC; timed runs between 2026-10-08T16:08:50Z and 2026-10-08T16:56:15Z
geode_commit = "61e8571ee7383885d1896cf64169e93994fa9609 dirty=0"
scope = "one AWS m6i.4xlarge with no other workload, one session; geode (direct LU) and Palace (iterative) on the committed 133k transmon fixture; not a scaling study"
fixture = "crates/geode-core/tests/fixtures/transmon_smoke.msh"
fixture_sha256 = "5b3ff4c357a4dc905e7a2e42abc8178778b626e47582c7bbe610f95d332b33dd"
n_interior_dofs = 133108
geode_binary = "cargo build --release -p geode-core --example transmon_bench; GEODE_INNER=direct (faer COLAMD sparse LU shift-invert Lanczos, f64)"
palace_binary = "palace:cpu image built on the box from reference/palace/docker/Dockerfile; config = reference/fixtures/transmon_palace/palace_config.json with only Model.Mesh, Problem.Output and, for the non-fixture requests, Solver.Eigenmode.N / Target changed (Save = 6, Tol = 1e-8, Order 1 kept)"
timing = "/usr/bin/time -v over the full solver process (mesh load + assembly + solve + output). For Palace it wraps `palace -np N` inside the container, so container start-up is excluded"
core_seconds = "user + sys CPU seconds from the same /usr/bin/time: summed over all threads (geode) or over mpirun and all ranks (Palace)"
memory = "peak resident set size from /usr/bin/time. geode: the one process. Palace: the LARGEST SINGLE process, not the sum over ranks (Palace's own total is in each raw log)"
statistic = "every run is listed; min, median and max over the runs of a cell. No mean, no outlier rejection"
order = "runs are sequential, never two at once, round-robin over cells (repeat 1 of every cell, then repeat 2, ...)"
generator = "benchmarks/transmon_bench_cpu/m6i_box_setup.sh and m6i_box_bench.sh on the box, then summarize_like_for_like_m6i.py"


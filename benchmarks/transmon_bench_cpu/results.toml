# ---- Triangular-solve investigation → DOCUMENTED NEGATIVE (AC-sanctioned). --
# The shift-invert inner loop applies (K−σM)^{-1} once per Krylov step via a
# single-RHS forward/back substitution on the faer LU factors (`solve_with_lu`
# in eigen/lanczos.rs). #518's design notes already flagged rayon as slower
# there for a single RHS, and #518's guard deliberately reverts to serial for
# this loop. Issue #522 MEASURES it directly: factor A = K + M (the exact
# shifted-pencil structure at σ = −1, SPD/nonsingular so sp_lu is clean) from
# the same 133k-DOF fixture, then time one `lu.solve_in_place` for a single
# RHS under serial vs rayon(8) global parallelism (median of 50 solves).
# Result: rayon REGRESSES the single-RHS solve ~1.85× (latency-bound; the
# forward/back substitution is inherently sequential per column and the outer
# full-reorthogonalization Lanczos recurrence — each v_{j+1} depends on w_j —
# cannot be RHS-batched without restructuring, which is out of scope). This is
# the honest documented negative the AC permits.
[strong_scaling_522.triangular_solve]
investigated = true
outcome = "documented negative — rayon regresses the single-RHS triangular solve"
matrix = "A = K + M from the sha-pinned transmon fixture (σ = −1 shifted-pencil structure), n = 156863, nnz = 2561711"
statistic = "median of 50 single-RHS lu.solve_in_place calls, release build, same box/session"
serial_ms = 102.0
rayon8_ms = 188.8
rayon_slowdown_x = 1.85
reason = "single-RHS forward/back substitution is latency-bound; faer 0.24 exposes no per-call Par for the triangular solve; the sequential Lanczos recurrence forbids RHS-batching without restructuring (out of scope). The eigensolve keeps this loop serial (the #518 ParallelismGuard scopes rayon to sp_lu only)."

[notes]
# --- Target-sensitivity finding (FIRST-CLASS RESULT, issue #523 scope 2) -----
# geode's direct sparse-LU shift-invert is TARGET-INSENSITIVE: the cost of a
# single sparse factorization at the shift does not depend on how far the
# target sits from a "good" operating point, so moving 6@4.5GHz → 12@20GHz
# barely changes geode's wall time (28.7 s → 36.8 s at 1 core; 29.0 s →
# 26.6 s at 8 threads). Palace's iterative Krylov+AMS DEGRADES far off-target:
# a poorly-placed shift slows convergence, so Palace's wall time balloons
# (130.9 s → 248 s at np1; 44.5 s → 64.7 s at np8). This is why the geode
# advantage WIDENS off-target (Palace/geode ≈ 6.7× serial and ≈ 2.4× at
# 8-wide off-target, vs a more modest on-target gap) rather than being a
# fixed multiplier.
# #927: both gaps compare the same REQUEST. Which modes either solver returned
# in these sessions is unverified (see [notes].output_equivalence_927).
target_sensitivity = "geode direct sparse-LU shift-invert is target-insensitive (factorization cost independent of target placement); Palace iterative Krylov+AMS degrades far off-target (slower convergence at a poorly-placed shift). Hence the off-target gap (≈2.4-6.7×) exceeds the on-target gap. CAVEAT (#927): these are gaps for the same request, not for the same returned modes; see output_equivalence_927."

# --- Memory/speed crossover (FIRST-CLASS RESULT, issue #523 scope 3) ---------
# geode's DIRECT factorization trades memory for speed + target-insensitivity:
# it is faster wall-clock on small–medium problems (28.7 s on 1 core beats
# Palace's 44.5 s on 8 ranks at 133k DOF), but its factorization fill-in grows
# super-linearly and hits a HARD MEMORY WALL — at ~1.16M interior DOF it OOMs
# on a 61 GB box (63.9 GB peak, exit 137). Palace's ITERATIVE solver scales
# with low, roughly rank-flat memory (~4 GB/rank at 1.16M DOF) and completes
# (423 s, np8), just slower on the small case. geode's advantage is therefore
# SCALE-BOUNDED. The geode scale path (to remove the memory wall, NOT to beat
# Palace's wall time) is the matrix-free eigensolver (#524) plus an AMS-style
# H(curl) preconditioner (#526) — an iterative inner solve that avoids the
# direct-factorization fill-in.
# #927: "faster small-medium" is a same-request wall clock; the geode run is not
# known to have returned Palace's six modes (see output_equivalence_927). The
# memory wall is independent of that.
memory_speed_crossover = "geode direct factorization has the lower wall clock for the same request small–medium (28.7 s/3.1 GB @ 133k DOF vs Palace 44.5 s @ 8 ranks; NOT verified to be the same returned modes — #927, see output_equivalence_927) but OOMs at ~1.16M DOF (63.9 GB peak, exit 137 on a 61 GB box); Palace iterative scales with low per-rank memory (~4 GB/rank) and completes (423 s). Crossover is memory-bound. geode scale path: matrix-free eigensolver (#524) + AMS H(curl) preconditioner (#526)."

# --- Per-core efficiency reading (honest, not a headline claim) --------------
#   At the physical target (6 modes @ 4.5 GHz), matched session:
#     geode 1 thread   28.7 s  (28.7 core-s)
#     geode 8 threads  29.0 s  (~no speedup — see #518)
#     Palace np1      130.9 s
#     Palace np8       44.5 s  (356.0 core-s)
#   geode on ONE core (28.7 s) beats Palace on EIGHT ranks (44.5 s) in absolute
#   wall clock, and consumes ~12× fewer core-seconds (28.7 vs 356) — expressed
#   as a per-core-efficiency win, NOT a "we parallelized better" claim (geode's
#   8-thread run gives ~no speedup at the physical target; see #518).
# #927: the 28.7 s and 44.5 s are wall clocks for the same REQUEST. The geode
# run is not known to have returned the six modes Palace returns; where a mode
# log exists for this request, geode returned one of them. Do not read the
# "~12x fewer core-seconds" as the cost of an equivalent answer.
# #763: the 28.7 s is not established as a one-core time either, and the
# 2026-10-08 re-measurement reproduces neither the 12x nor the wall-clock win.
# See serial_lu_763 below.
per_core_efficiency = "At the physical target, geode serial (1 core, 28.7 s) has a lower absolute wall clock than Palace on 8 ranks (44.5 s) for the same request, at ~12× fewer core-seconds. CAVEAT (#927): this is NOT established for an equivalent output — the geode run's modes are unverified, and in every logged run of this request geode returned 1 of the 6 physical modes Palace returns (see output_equivalence_927). It is a per-core-efficiency + direct-vs-iterative reading of one request, NOT a parallelization claim — geode 8-thread gives ~no speedup at the physical target (#518)."

# --- Architecture trade-off (the honest framing, NOT a winner declaration) ---
architecture = "geode-fem: DIRECT sparse-LU shift-invert Lanczos — high per-core throughput, target-insensitive, single-process memory that grows with factorization fill-in (3.1 GB @ 133k DOF → OOM @ ~1.16M DOF). Palace: DISTRIBUTED MPI Krylov + AMS iterative — scales across ranks with low per-rank memory (0.5 GB @ 133k → 4.1 GB/rank @ 1.16M), target-sensitive, but completes at large scale where the direct path OOMs. Neither is uniformly better: geode has the lower same-request wall clock small–medium (output equivalence unverified, #927); Palace wins at scale on memory."

# --- Output equivalence (issue #927) -----------------------------------------
output_equivalence_927 = "The [matched.*] tables match the REQUEST (mesh, mode count, target), not the RETURNED MODES. Palace applies a divergence-free projection and its committed run returns six physical modes (5.15-26.08 GHz). geode's ungauged shift-invert returns the six eigenvalues nearest the shift; in every logged run of '6 modes, 4.5 GHz' (Lambda A100: ../transmon_bench_gpu/results.toml; dev machine: results_like_for_like_local.toml) those are 4 gradient near-kernel modes, the spurious 3.45 GHz port mode and one physical mode. The m6i geode runs of this file have no committed mode log, so their cells say 'unverified (no committed mode log)'; the committed 1.16M log is audited in [mode_audit_1p16M] and is not like-for-like. What geode must be asked for to return Palace's six modes on the 133k fixture, and the cost of that relative to the 6-mode request ON THE SAME DEV MACHINE, is recorded in results_like_for_like_local.toml (geode only; its times are not comparable with any cell of this file). DONE 2026-10-08: the same-box re-timing with every mode list committed is results_like_for_like_m6i.toml (see remeasured_like_for_like_m6i); it confirms 1 of 6 for this request on the m6i and reports three six-mode geode requests beside Palace without declaring a winner. No number in THIS file supports 'geode is faster than Palace at the transmon eigenmode'. Paper impact: #763 (efficiency claim), #593 (Zenodo publish)."

# --- Same-box re-measurement (issues #927, #763), 2026-10-08 -----------------
# results_like_for_like_m6i.toml: one m6i.4xlarge (us-east-1), one session,
# geode 61e8571e and Palace fba6a5b, every run's mode list committed under
# runs/2026-10-08_m6i_like_for_like/. Medians of n = 3 unless stated.
#
#   request                           width   physical      wall (s)   core-s
#   geode 6 @ 4.5 GHz (historical)    1 thr   1 of 6          32.8       32.8
#   geode 6 @ 4.5 GHz (historical)    8 thr   1 of 6          27.1       38.6
#   geode 30 @ 4.5 GHz (more modes)   1 thr   6 of 6 (+24)    34.5       34.4
#   geode 30 @ 4.5 GHz (more modes)   8 thr   6 of 6 (+24)    29.1       40.7
#   geode 6 @ 20 GHz (shift)          1 thr   6 of 6          33.2       33.2
#   geode 6 @ 20 GHz (shift)          8 thr   6 of 6          27.3       38.9
#   geode 8 @ 4.5 GHz, port-aware     1 thr   6 of 6 (+2)     67.3       67.2
#   geode 8 @ 4.5 GHz, port-aware     8 thr   6 of 6 (+2)     51.1       91.7
#   Palace 6 @ 4.5 GHz, Save = 6      1 rank  6 of 6         186.8      186.8
#   Palace 6 @ 4.5 GHz, Save = 6      8 rank  6 of 6          33.4      266.7
#   Palace 6 @ 4.5 GHz, Save = 0      1 rank  6 of 6         113.0      113.0   (n = 1)
#   Palace 6 @ 4.5 GHz, Save = 0      8 rank  6 of 6          23.6      188.9
#
# Read with these, all recorded in that file: "30 modes" was found by trial
# against the Palace oracle; the 20 GHz shift was chosen knowing where the
# modes are; port-aware is the only request not tuned against the oracle and
# it still returns two non-physical modes (#950). Palace's Save = 6 rows
# include ParaView output that geode does not write; its Save = 0 rows still
# include its error estimator (5.0 of 23.6 s at 8 ranks, 40.2 of 112.9 s at
# 1 rank), which geode does not run. Palace is untuned (no libxsmm,
# -march=x86-64-v2): its times are an upper bound for a tuned build. Its
# times differ from the 2026-07-14 cells above in both directions and that
# was not investigated. No winner is declared.
remeasured_like_for_like_m6i = "Same-box re-timing of 2026-10-08 (results_like_for_like_m6i.toml; raw logs under runs/2026-10-08_m6i_like_for_like/). The historical request (6 modes, 4.5 GHz) returns 1 of Palace's 6 modes on the m6i too. Three geode requests return all six, each agreeing with Palace to 0.029%: 30 modes at 4.5 GHz (found by trial against the oracle), 6 modes at 20 GHz (shift chosen knowing the spectrum) and 8 modes at 4.5 GHz with the port-aware projection (not oracle-tuned; returns two non-physical modes, #950). Median wall, 1 thread / 8 threads: 34.5 / 29.1 s, 33.2 / 27.3 s and 67.3 / 51.1 s. Palace on its fixture request: 186.8 s at 1 rank and 33.4 s at 8 ranks with Save = 6, 113.0 s (n = 1) and 23.6 s with Save = 0. Core-seconds at 8-wide: geode 38.9 to 91.7, Palace 266.7 (Save = 6) or 188.9 (Save = 0); MPICH ranks busy-wait, so Palace's core-seconds are close to 8 x wall by construction. On this mesh Palace at 8 ranks without field output has the lower wall clock than every geode cell, and geode uses fewer core-seconds than Palace in every cell. Both statements carry these caveats. Palace was built from the vendored recipe (reference/palace/docker/Dockerfile) without libxsmm and with -march=x86-64-v2, so every Palace time here is an upper bound for a tuned build, and any reading that has geode ahead (core-seconds, one-wide wall clock) is about this Palace build. Save = 0 removes field output only: by Palace's own phase timers those runs still spend 5.0 s of 23.6 s at 8 ranks and 40.2 s of 112.9 s at 1 rank in its error estimator, which geode has no counterpart for (whether it can be switched off at this Palace commit was not checked). Palace's times also differ from this file's 2026-07-14 cells in opposite directions (1 rank 186.8 s against 130.9 s, 8 ranks 33.4 s against 44.5 s); that is unexplained and was not investigated. Neither statement extends beyond this mesh, host and these builds, and no winner is declared."

# --- Serial LU (issue #763) --------------------------------------------------
serial_lu_763 = "The historical '1 thread' rows (28.7 s here, 36.8 s off-target) set GEODE_NUM_THREADS=1 with no pinning and no recorded CPU time, at a commit where that knob did not make faer's LU serial. The 2026-10-08 re-run pins one CPU with taskset and records Cpus_allowed_list and CPU time per run: 32.82 s median at one thread, 27.10 s at eight. The historical 28.7 s sits 13% below the enforced one-thread time and 6% above the eight-thread time, and matches its own 8-thread row to 1%; that is consistent with a multithreaded LU in the historical '1 thread' row and is not proof (different commit, region, session). At the current commit GEODE_NUM_THREADS=1 alone, unpinned, measures 102% CPU and 32.69 s, so the knob is serial today. Consequences: 28.7 s must not be quoted as a one-core time; the '~12x fewer core-seconds' (28.7 vs 356.0) is not reproduced: measured, geode one thread 32.8 core-s against Palace 8 ranks 266.7 core-s is 8.1x for a geode run that returns 1 of the 6 modes, 7.7x and 8.0x for the two oracle-tuned six-mode requests, 4.0x for port-aware, and 5.8x / 5.5x / 5.7x / 2.8x against Palace with Save = 0. Those ratios carry the caveats of remeasured_like_for_like_m6i: Palace's MPICH ranks busy-wait, so its core-seconds are close to 8 x wall by construction, and Palace is untuned (no libxsmm, -march=x86-64-v2), an upper bound for a tuned build. 'One core beats eight ranks in wall clock' is not reproduced either: 32.8 s against 33.4 s (Save = 6) is a tie, and against 23.6 s (Save = 0) Palace is ahead. See results_like_for_like_m6i.toml [issue_763]."


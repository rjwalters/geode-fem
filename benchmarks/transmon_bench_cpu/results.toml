[matched.physical_target]
problem = "6 eigenmodes, target 4.5 GHz (the physical transmon operating point)"
palace_eigen_n = 6
palace_target_ghz = 4.5
palace_save = 6
n_interior_dofs = 133108
n = 3   # each timing below is the mean of n=3 runs on the same box/session

  [matched.physical_target.geode_1thread]
  cores = 1
  geode_num_threads = 1
  mode = "serial faer sparse-LU shift-invert Lanczos (direct)"
  wall_s = 28.7
  peak_rss_gb = 3.1
  modes_returned = "unverified (no committed mode log)"
  n_physical = "unverified (no committed mode log)"
  like_for_like = "unverified"   # vs the Palace cells of this table; see the OUTPUT-EQUIVALENCE CAVEAT in the header (#927)
  like_for_like_note = "No mode log of this m6i run (geode 3174015) is committed. The same request (direct, 6 modes, 4.5 GHz) returned 1 of Palace's 6 physical modes in every logged run on two other hosts at later commits (../transmon_bench_gpu/results.toml; results_like_for_like_local.toml [[cell]] ungauged_s4p5_n6). That is evidence, not a record of this run."
  remeasured_2026_10_08 = "results_like_for_like_m6i.toml [[cell]] geode_s4p5_n6_t1 (same instance type, us-east-1, geode 61e8571e, mode log committed): the same request returns 1 of Palace's 6 physical modes (4 near-kernel, the 3.45 GHz port mode, 5.152825 GHz), so it is NOT like-for-like; wall 32.65 / 32.82 / 33.66 s (min / median / max, n = 3), 32.8 core-seconds, 3.16 GB."
  serial_763 = "This row's '1 thread' was a request (GEODE_NUM_THREADS=1), not an OS limit, and before #762 that knob did not make faer's LU serial. No CPU time was recorded, so whether it ran one thread cannot be read back. The 2026-10-08 re-run enforces one CPU with taskset (Cpus_allowed_list = 0, 100% CPU): 32.82 s median, against 27.10 s at 8 pinned threads. This row's 28.7 s is 13% below that one-thread time and 6% above that 8-thread time, and it equals its own 8-thread row (29.0 s) to 1%, where the pinned rows differ by 17%. That is consistent with this row having run a multithreaded LU; it is not proof (different geode commit, region and session). Do not quote 28.7 s as a one-core time: results_like_for_like_m6i.toml [issue_763]."


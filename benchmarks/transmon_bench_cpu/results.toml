  remeasured_2026_10_08 = "results_like_for_like_m6i.toml [[cell]] geode_s4p5_n6_t8 (8 threads pinned to one hardware thread on each of the 8 cores): returns 1 of Palace's 6 physical modes, NOT like-for-like; wall 26.90 / 27.10 / 27.17 s (n = 3), 38.6 core-seconds (142% CPU), 3.24 GB."


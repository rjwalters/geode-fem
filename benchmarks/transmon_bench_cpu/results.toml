# ---- LARGE-SCALE CROSSOVER: ~1.16M interior DOF (uniformly refined). --------
# gmsh -refine ×8 of the fixture (physics-neutral uniform refinement of the
# element count). The IDENTICAL refined mesh ran through both solvers at the
# physical target (6 modes @ 4.5 GHz). This is the measured memory/speed
# CROSSOVER: geode's direct factorization fill-in hits a hard memory wall and
# is OOM-killed on the 61 GB box; Palace's iterative solver completes with
# ~4 GB/rank (just slower). See [notes.memory_speed_crossover].
[matched.large_scale]
problem = "6 eigenmodes, target 4.5 GHz, on the gmsh -refine ×8 (×8 element-count) uniform refinement of the fixture"
mesh_refine = "gmsh -refine (uniform, physics-neutral element-count ×8 of the transmon fixture)"
n_interior_dofs = 1157564   # 1,157,564 interior DOF
n_nodes = 179000            # ~179k nodes
n_tets = 1130000            # ~1.13M tetrahedra
palace_eigen_n = 6
palace_target_ghz = 4.5

  [matched.large_scale.geode]
  ranks = 1
  mode = "direct faer sparse-LU shift-invert (Lanczos)"
  outcome = "OOM-killed (SIGKILL, exit 137) at ~3.5 min — direct-factorization fill-in exceeded the 61 GB box"
  exit_code = 137
  peak_rss_kb = 63867824      # 63.9 GB peak RSS before SIGKILL (from geode_big_results.txt)
  peak_rss_gb = 63.9
  wall_note = "never completed (killed at ~3.5 min); no wall time recorded"
  modes_returned = "none (OOM-killed before the eigensolve returned)"
  n_physical = 0
  like_for_like = false   # no output at all; this cell is a memory-wall record, not a timing comparison

  [matched.large_scale.palace]
  ranks = 8
  mode = "distributed MPI Krylov + AMS (iterative)"
  outcome = "completed"
  exit_code = 0
  wall_s = 423.12             # 7:03.12 elapsed (from palace_big_results.txt)
  peak_rss_kb = 4132104       # 4.1 GB/rank (per-rank max single-process RSS)
  peak_rss_gb_per_rank = 4.1
  modes_returned = "unverified (palace_big_results.txt and its eig.csv are not committed)"
  n_physical = "unverified (no committed log)"

  [matched.large_scale.raw_logs]
  geode = "geode_big_results.txt (exit=137, maximum resident set 63867824 kB)"
  palace = "palace_big_results.txt (exit=0, elapsed 7:03.12, maximum resident set 4132104 kB)"

# ---- 1.16M-DOF MODE AUDIT (issue #927): the one committed geode mode log. ---
# geode_runs_1p16M_2026-07-15.log is a LATER run than [matched.large_scale]: the
# same refined mesh on a memory-abundant box, where the COLAMD direct solve
# completed (TOTAL_S = 565.531, max RSS 92166884 kB; the AMD-ordered run was
# killed). It is the only committed log in this directory that lists the modes
# geode returned, so it is the only cell whose mode content is verified here.
[mode_audit_1p16M]
source = "geode_runs_1p16M_2026-07-15.log, section 'DIRECT (COLAMD) @ 1.16M' (inner = Direct, target = 4.5 GHz, n_modes = 6, 1157564 interior DOFs)"
modes_f_ghz = [0.6215, 0.7479, 0.8627, 2.4890, 3.8938, 5.4136]
modes_participation = [0.0000, 0.0000, 0.0000, 0.0000, 0.9637, 0.0011]
n_below_target = 5          # five of the six returned modes lie below the 4.5 GHz target
n_physical_verified = 0     # no Palace eigenvalue file for the refined mesh is committed, so no mode can be matched to an oracle
n_physical_at_most = 1      # only 5.4136 GHz lies above the target; whether it is the resonator on this mesh is not established (5.09% from the 133k-mesh Palace 5.1513 GHz)
like_for_like = false       # inferred, not oracle-checked: Palace's lowest physical mode of this device is 5.15 GHz on the 133k mesh, and five of geode's six modes here are below 4.5 GHz
note = "The 3.8938 GHz mode has participation 0.9637, the signature of the spurious port mode that sits at 3.4528 GHz on the 133k mesh (../transmon_eigen/results.toml [spurious_mode], #514); that identification is by pattern, not by an oracle. The four participation-0 modes at 0.62-2.49 GHz are not classified here. So the 565.5 s geode time quoted against Palace's 423 s at this size (docs/research/geode-vs-palace-comparison.md, section 2b) is also a same-request, not a same-answer, comparison; geode was already the slower one there."


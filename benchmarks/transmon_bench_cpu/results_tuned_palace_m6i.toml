# Tuned-Palace re-timing of the transmon eigenmode benchmark on one AWS m6i.4xlarge,
# with a same-box untuned control and the untuned PR #964 run beside it (issue #927).
# GENERATED by benchmarks/transmon_bench_cpu/summarize_tuned_palace_m6i.py from
# benchmarks/transmon_bench_cpu/runs/2026-10-09_m6i_tuned_palace/ (tuned + untuned_control/)
# and benchmarks/transmon_bench_cpu/runs/2026-10-08_m6i_like_for_like/ (PR #964); do not edit by hand, rerun the script.
#
# ---------------------------------------------------------------------------
# READ FIRST
#   * NO WINNER IS DECLARED HERE. Ratios are given with the size and config
#     they belong to so nobody has to recompute them; they are not claims.
#   * THE TUNING EFFECT IS [palace.*].untuned_same_box_over_tuned_*: tuned and
#     untuned Palace built and timed on ONE instance, one session, same driver.
#     The PR #964 numbers are another instance of the same type; between the
#     two instances geode itself moves by 6-9% ([geode_session_check]), which
#     is as large as the tuning effect, so a PR #964 / tuned ratio mixes
#     instance and build and is given only for reference.
#   * Same fixture, same configs (Save = 6 and Save = 0), same rank counts (1,
#     8), same pinning, same geode requests as PR #964. Linear.Type is written
#     EXPLICITLY as SuperLU in every Palace cell of this run, tuned and control;
#     PR #964 left the fixture's "Default", which resolves to SuperLU at this
#     Palace commit ([palace_linear_solver]).
#   * MPICH ranks busy-wait, so a Palace core_s is close to ranks x wall by
#     construction; core-seconds overstate the CPU work Palace needs.
#   * Save = 0 removes the ParaView field output only; Palace still runs its
#     error estimator, which geode has no counterpart for.
#   * geode is built for the default x86-64 target CPU (no -C target-cpu), as
#     in PR #964: only Palace was tuned for the host.
#   * ONE MESH (133,108 interior DOFs, first order). Nothing here extrapolates
#     to another mesh size.
# ---------------------------------------------------------------------------


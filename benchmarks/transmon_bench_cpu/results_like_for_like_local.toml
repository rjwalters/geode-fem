[finding]
baseline_cell = "ungauged_s4p5_n6"
baseline_n_physical = 1  # the timed configuration returns this many of Palace's 6
baseline_wall_s_mean = 23.16  # dev machine, loaded, one thread
baseline_cpu_s_mean = 20.68  # user + sys
gradient_kernel_dim = 13747  # rank(d0_interior), ../transmon_eigen/results.toml [spurious_mode].tree_cotree_gradient_dofs
min_shift_ghz_for_six_before_kernel = 18.44  # top Palace mode / sqrt(2): below this shift the kernel is nearer than the top mode
same_target_near_kernel_ritz_values = 23  # in the smallest 4.5 GHz request that returns all six (ungauged_s4p5_n30)
same_target_mechanism = "Shift-invert orders eigenvalues by |lambda - sigma|, lambda ~ f^2. At sigma = 4.5 GHz only the 5.15 GHz mode is nearer the shift than lambda = 0, where the gradient near-kernel (dimension gradient_kernel_dim) sits; the other five physical modes are farther than every kernel mode. A converged enumeration would therefore need more than gradient_kernel_dim modes. This solver path (SparseShiftInvertLanczos::smallest_eigenpairs) does not enumerate: it builds a Krylov space of max(96, n_modes + 2) steps from a deterministic start vector and returns the n_modes Ritz values nearest the shift, with no per-pair residual check. In that space the kernel shows up as only same_target_near_kernel_ritz_values Ritz values, so a request large enough to hold them, the 3.45 GHz mode and the six physical modes returns the six. That count belongs to this Krylov size, start vector and mesh. It is not a property of the eigenproblem and was not tested on any other mesh."
scope = "One mesh (133,108 interior DOFs, first order), one host, geode only, direct LU. The mode counts and the frequency agreement do not depend on load. The wall clocks do (cpu_percent below 100 marks a descheduled run), so the cost ratios to read are the cpu_ratio_* fields: CPU seconds of single-threaded runs of this file against each other. Nothing here is a geode-vs-Palace time, and a one-thread CPU-second ratio on this machine is not a prediction of the multi-threaded wall-clock ratio on a benchmark host."
moved_shift_caveat = "Moving the shift to 20 GHz is a different request from Palace's (N = 6, Target = 4.5 GHz). It returns the six physical modes only because 20 GHz was chosen knowing where they are (it must exceed min_shift_ghz_for_six_before_kernel). It is not a general recipe."
same_target_caveat = "Raising the mode count at 4.5 GHz returns the six physical modes only buried among near-kernel Ritz values (and, for larger requests, unclassified ones above 26 GHz). The request size that works was found by trial against the oracle; nothing in the solver output says when it is large enough."
port_aware_caveat = "The port-aware solve keeps the 4.5 GHz shift and needs no reference-solver number (the junction extract is placed at the analytic f_LC). It still returns two non-physical modes ahead of the top physical ones: one near-zero survivor and the solenoidal 3.45 GHz port mode, which no divergence-free projection removes (#514). A caller needs a rule to drop them; here that rule is the Palace oracle."

[deferred]
# NOT done in this file. Operator-run, paid hosts (issue #927).
not_done = [
  "same-box, same-session re-timing of geode (moved shift or port-aware) against Palace on the m6i benchmark host (AWS geode-fem-bench)",

  "the 1.16M-DOF cell: no Palace oracle for the refined mesh is committed, so its modes cannot be classified here",
  "revising the efficiency claim of papers/transmon-benchmark (see #763, #593)",
]
follow_up = "#950: a timed geode configuration that returns the six physical modes at the 4.5 GHz shift with no oracle filter (drop the near-zero survivor, remove or identify the 3.45 GHz port mode, cut the port-aware cost)"


[notes]
geode_cuda = "Acceptance criterion 4 asks for a head-to-head vs geode-CUDA at the same mesh. geode has no GPU eigensolve path (deferred by design: docs/research/gpu-eigensolve-path-design.md, #606), so no geode-CUDA eigenmode cell can exist; the same-box geode CPU f64 cell is the geode comparator. geode-CUDA would also be f32-only (burn-cuda 0.21 / cubecl disables f64), which this eigenproblem (Tol 1e-8) could not use as-is. The only geode-CUDA vs Palace-GPU head-to-head that exists is the DRIVEN solve — issue #520."
paraview = "Palace's ParaView field writer dominates the fixture (Save = 6) cells in this CUDA image: 614-625 s of a ~690 s single-rank GPU run, and 84-87 s of a ~136 s 8-rank CPU run of the SAME image. The committed m6i CPU baseline (LTO'd, LIBXSMM image) spent 6.7 s in ParaView. The slowdown is therefore a property of this CUDA build's host-side output path (it also appears with Device = CPU), amplified on 1 rank; it is not solver time. Not investigated further here."
same_build_vs_baseline = "The CPU control here is the SAME image as the GPU cells (isolating the device). It is NOT the image of the committed CPU baseline (that one is LTO-built with LIBXSMM: /cpu/self/xsmm/blocked, 31.25 s total on m6i), so do not compare palace_cpu_np8 here with transmon_bench_cpu across hosts/images."
single_rank_gpu = "Palace-GPU ran 1 MPI rank on the single GPU (the standard 1 rank : 1 GPU mapping); a 1-GPU box offers no other mapping. This is a general caveat, NOT the explanation of the gap: Palace's timers attribute 19.7 s of the 21.0 s GPU deficit to Operator Construction + Setup + Preconditioner (30.85 s vs 11.12 s). Mesh preprocessing is effectively serial in the 8-rank CPU control too (one rank 21.4 s while the others wait in Initialization); per-rank Initialization + Mesh Preprocessing is 35.66 s on GPU vs 26.28 s on CPU (+9.4 s), offset by -8.1 s in the remaining rows (div-free projection, error estimation, linear solve)."
phase_accounting = "Palace's Elapsed Time Report rows are exclusive (an indented sub-timer is not included in its parent), so on any one rank the rows sum to Total. The Max-over-ranks column cannot be summed across rows: on 8 ranks, Initialization Max = 24.07 s and Mesh Preprocessing Max = 21.39 s come from DIFFERENT ranks (min/max pairs 4.88+21.37 and 24.03+2.22 both give 26.25 s). Summing the Max column gives a phantom 45.5 s for Init + Mesh on CPU (and 64.1 s for all rows vs a 50.6 s Total). Group sums above therefore use the Avg column, which does sum to Total (summarize.py prints the check, phase_avg_rows_sum_s)."
geode_threads = "GEODE_NUM_THREADS caps faer's sparse LU thread pool (crates/geode-core/src/eigen/parallel.rs) but not the rest of the pipeline: the =1 cells used 683-690% CPU (198 s user + 48 s sys over 36 s wall) and the =8 cells 961-984%. Neither geode cell is a thread-count-matched comparison with Palace (795% on 8 ranks; 100% for the 1-rank GPU run, whose work is on the device)."
geode_modes = "Every geode run returned the same 6 pairs: 4 gradient near-kernel modes (0.000478, 0.000562, 0.000602, 0.000760 GHz; participation 0), the known spurious 3.452751 GHz mode (p = 0.9942; benchmarks/transmon_eigen/results.toml [spurious_mode], #514) and 5.152825 GHz (matches Palace's 5.151336 GHz to 0.029%). Palace returns 6 physical, div-free-projected modes (5.15-26.08 GHz). The wall-clock comparison is therefore not like-for-like in output, and this run applies no geode eigen-agreement gate."

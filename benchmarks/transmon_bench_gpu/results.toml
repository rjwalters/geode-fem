wall_s_mean = 51.03
wall_s_stddev = 0.25
peak_rss_kb_per_rank_max = [940708, 941908, 924636]
phase_s = { initialization = 24.07, mesh_preprocessing = 21.39, operator_construction = 0.93, linear_solve = 1.65, setup = 0.30, preconditioner = 9.91, eigenvalue_solve = 0.64, div_free_projection = 3.54, estimation = 0.13, postprocessing = 0.45, disk_io = 1.08, total = 50.58 }   # Palace Elapsed Time Report (Max over ranks), mean of 3


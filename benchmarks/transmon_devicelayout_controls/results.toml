why_above_cap = "The initial-qubit shared limit (4.4802 GHz) exceeds the model-dependent cap (4.4766 GHz) by 3.6 MHz, 0.08 %. The construction is exactly determined (four levels, four unknowns) and ill-conditioned: +0.1 % on the order-2 h/2 level alone moves it by about 20 MHz (initial_q_sensitivity_ghz_per_0p1pct), so the excess equals a 0.019 % change of that one level (initial_q_excess_as_p2_h2_change_pct_exact), far inside the 0.15-1.8 % mesh and refinement-scheme effects of [mesh_family.initial]. It also assumes one common order for the order-1 and order-2 series in the pre-asymptotic range, where the order-1 ladder's own observed order is 0.62. The same construction on the second refinement family (family_b_initial_q, order 1.02, where the ladder is close to its asymptotic order) gives 4.4657 GHz, below the cap, as do both family estimates and the adaptive run's finest computed level, 4.4297 GHz ([mesh_family.initial].all_estimates_below_cap). The adaptive run's three-point DOF extrapolation (4.4552 GHz) is exactly determined too and at least as ill-conditioned (+0.1 % on its finest level moves it by about 24 MHz), so its 21 MHz margin below the cap is an estimate, not evidence either way. The excess is within the conditioning of the family-a fit and is not evidence against the cap; the cap is still model-dependent, not certified."

coarse_mesh = "C_Sigma is computed on a morphed copy of the coarse committed 133k-tet mesh. The fresh solve shows the optimizer is self-consistent; it does not show mesh convergence, nor equivalence with a DeviceLayout-regenerated device at the final dimensions."
regeneration = "regenerating the device at the final dimensions needs the offline Julia/DeviceLayout toolchain: operator-only, not done"
remeshing = "operator-only, not done"
stiffening_is_the_route = "measured: with fixed fields and with unit re-morphing the optimizer stalls on the 0.25 ratio floor short of 89.9 fF (see [[run]]); only the volume-stiffened morph reaches it in this sweep. The mesh-quality floor is a property of the morph, not of the physical design, so the reached design depends on alpha (a larger alpha reaches a different design)."
scalar_tensor_sign = "measured (scalar - tensor)/tensor = -4.9014e-3 at X_final against +7.4759e-3 at the #589 limit design: the scalar-eps error depends on the geometry, sign included, so the tensor anchor needs its own run ([tensor_retarget])"
theta_g_limit = "measured: theta_G's re-morph bound is 1.001989 for every alpha and both path steps, and its limiting tet (centroid near [-58.6, 200.6, -13.3] um) has 3 of its 4 nodes pinned by theta_G's Dirichlet data (worst_tet_pinned_nodes). Inference: the morph has almost no say over that tet's ratio, so stiffening cannot move the bound; the stiffened runs reach the anchor through theta_L and theta_W while theta_G sits on it."
theta_is_a_trace = "with re-morphing the accumulated theta is path-dependent; the physical dimensions measured from X_final are the design output"
scalar_anchor = "the anchor is the scalar-eps C_Sigma; the tensor-eps value at the scalar design is listed in [headline] and reaches 89.9 fF only in [tensor_retarget]"
